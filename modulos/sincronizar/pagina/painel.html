<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sincronizar</title>
<!--
  A INTERFACE do painel do Órbita no Media Composer.

  ⚠️ Este arquivo NÃO vai dentro do `.avpi`. Ele é SERVIDO pelo app em
  `GET /avid/panel` (ver `ui_do_painel_avid` em `src-tauri/src/nle_install.rs`), e é
  isso que o coloca na MESMA ORIGEM da API — sem preflight, sem CORS, e sem o teto de
  duas rotas do esquema `avpi://`. Quem carrega esta página é o loader
  (`static/index.html`, esse sim empacotado). Ver ADR 0017.

  CREDENCIAL: a própria origem. O portão aceita `http://127.0.0.1:7817` no lugar do
  token — e por isso **nenhum token é injetado aqui**: um segredo na página seria uma
  cópia a mais para vazar, sem comprar nada que a origem já não dê. Ver ADR 0017
  §"Por que a página não carrega o token".

  O marcador de i18n logo abaixo (um comentário HTML com SINC_I18N no nome) é
  substituído pelo app na hora de servir — pelo dicionário JÁ dentro de uma tag script.
  Com o marcador intacto o arquivo continua abrindo direto no navegador durante o
  desenvolvimento, só sem tradução.

  ⚠️ NÃO escreva o marcador literal em nenhum outro lugar deste arquivo, nem em
  comentário: a montagem exige que ele apareça UMA vez e recusa o resto (era o bug de
  2026-08-09 — o dicionário entrava também dentro deste cabeçalho).
-->
<style>
  :root {
    color-scheme: dark;
    /* ⭐ Os tokens vieram do Assist anterior (`ui/preparar/painel.css`), onde as abas
       Subclipar e Renomear já foram desenhadas e exercitadas com material real.
       Não havia o que reinventar aqui — e ter DOIS vocabulários de cor nos dois
       painéis do mesmo autor é o começo de duas interfaces diferentes.
       ⚠️ As regras antigas deste arquivo continuam com as cores literais que
       sempre tiveram: trocá-las de uma vez seria um diff enorme no que já
       funciona, sem ganho nenhum para quem usa. Elas convergem quando forem
       tocadas por outro motivo. */
    --bg:#2b2b2b; --panel:#333; --panel-2:#242424; --border:#3f3f3f;
    --fg:#e2e2e2; --muted:#a8a8a8; --faint:#8a8a8a;
    --accent:#3f66a5; --accent-forte:#5183cc; --accent-ink:#fff;
    --accent-escuro:#2d4a7a; --accent-borda:#5c8ad6; --accent-rgb:63, 102, 165;
    --ok:#7ec97e; --err:#e08080; --warn:#d9a95a;
    --radius:6px;
    --s1:6px; --s2:10px; --s3:16px;
  }
  * { box-sizing: border-box; }
  body {
    font: 13px -apple-system, "Segoe UI", sans-serif;
    background: #2b2b2b; color: #ddd; margin: 0; padding: 14px;
  }
  #status {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 10px; border-radius: 5px; font-size: 12px; margin-bottom: 12px;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  /* O pino da janela do app: apagado = solta; aceso = na frente das outras. */
  .pino { margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
          width: 24px; height: 24px; padding: 0; border: 1px solid transparent; border-radius: 4px;
          background: none; color: inherit; opacity: .55; cursor: pointer; flex: none; }
  .pino svg { width: 15px; height: 15px; }
  .pino:hover { opacity: 1; border-color: rgba(255,255,255,.25); }
  .pino[aria-pressed="true"] { opacity: 1; color: #fff; background: #3a6ea5; border-color: #3a6ea5; }
  .up { background: #1b3a1b; color: #a8e6a8; } .up .dot { background: #4caf50; }
  .down { background: #3a1b1b; color: #f0a0a0; } .down .dot { background: #e05050; }
  .wait { background: #333; color: #aaa; } .wait .dot { background: #888; }

  /* ⚠️ O painel do Avid é DOCÁVEL, e o editor o encolhe até onde quiser: com
     quatro abas mais a assinatura, o rótulo quebrava em duas linhas e a barra
     virava duas ("From bin" partido ao meio, visto na tela do autor). Três
     regras seguram isso sem tirar nada da vista:
       · `white-space: nowrap` — rótulo de aba não quebra, nunca;
       · `overflow-x: auto` — se não couber, a barra ROLA em vez de empilhar;
       · a assinatura só aparece quando há folga (ver a media query abaixo). */
  nav {
    display: flex; gap: 2px; margin-bottom: 12px; border-bottom: 1px solid #444;
    overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: #999; padding: 7px 9px; font-size: 12px; cursor: pointer;
    white-space: nowrap; flex: none;
  }
  nav button.on { color: #eee; border-bottom-color: var(--accent); }

  section { display: none; } section.on { display: block; }
  h2 { font-size: 12px; color: #bbb; margin: 0 0 4px; font-weight: 600; }

  /* ══ As abas de trabalho — desenho portado do Assist anterior ═════════════════
     ⭐ Blocos NUMERADOS, e a numeração não é enfeite: ela diz a ordem do
     trabalho ("1 · o que entrou" → "2 · o padrão"), que num painel estreito é a
     única pista de por onde começar. */
  .bloco {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--panel-2); padding: var(--s2); margin: 0 0 var(--s2);
  }
  .bloco-titulo {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px; margin: 0 0 var(--s1);
  }
  .dica { color: var(--faint); font-size: 11px; margin: var(--s1) 0 0; }
  #btLerSequenciaPr, #btLerSelecaoPr { margin-top: var(--s2); }   /* o respiro entre a dica e o botão (autor, 2026-11-08) */
  .estado { margin: var(--s1) 0 0; min-height: 1.2em; font-size: 12px; color: var(--muted); }
  .estado.erro { color: var(--err); }

  /* ⚠️ Quem rola é a LISTA, nunca a página: a janela do painel é curta, e uma
     diária de 200 itens empurraria o botão de ação para fora da tela. */
  .rolagem { max-height: 220px; overflow-y: auto; overflow-x: auto; }

  /* ⚠️⚠️ `width:max-content` com `min-width:100%`, e não `width:100%`. Com
     `width:100%` a tabela se resolve contra o container e só estoura no limite
     exato do min-content — o pior dos dois mundos, medido no Assist: a última
     coluna entrava DEBAIXO da barra de rolagem e a rolagem horizontal não
     aparecia, porque faltavam poucos pixels para o estouro. */
  .takes { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 11px; }
  .takes th {
    text-align: left; padding: 3px 6px; position: sticky; top: 0;
    background: var(--panel-2); color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .4px; font-size: 10px;
    border-bottom: 1px solid var(--border);
  }
  .takes td { text-align: left; padding: 3px 6px; white-space: nowrap; }
  .takes tbody tr:nth-child(even) { background: rgba(255,255,255,.02); }

  #renTabela td.ren-vira {
    color: var(--ok);
    /* ⚠️ `anywhere`, não `nowrap`: o nome NOVO é o que o editor precisa ler
       inteiro antes de aplicar, e escondê-lo atrás de rolagem horizontal é
       esconder justamente a informação que a aba existe para dar. */
    white-space: normal; overflow-wrap: anywhere; min-width: 40%;
  }
  /* ⚠️ Amarelo é AVISO, não erro: campo vazio e nome repetido não bloqueiam.
     Vermelho fica reservado para o que bloqueia, senão a cor perde o
     significado justamente quando ela precisa parar a mão do editor. */
  #renTabela tr.ren-aviso td.ren-vira { color: var(--warn); }
  #renTabela tr.ren-igual td.ren-vira { color: var(--faint); }

  .acoes { display: flex; gap: var(--s1); margin: 0 0 var(--s2); }
  /* ⚠️ o `display: flex` acima vencia o `hidden`: "Gerar" aparecia antes de qualquer leitura (visto 2026-11-07) */
  .acoes[hidden] { display: none; }
  .acoes button { flex: 1 1 auto; width: auto; padding: 9px 14px; margin: 0;
                  border: 1px solid var(--border); border-radius: var(--radius);
                  background: var(--panel); color: var(--fg); font-size: 13px;
                  font-weight: 600; cursor: pointer; }
  .acoes button.primary { background: var(--accent); border-color: var(--accent-forte);
                          color: var(--accent-ink); }
  .acoes button:disabled { opacity: .45; cursor: default; }

  /* ── a caixa do padrão, com o espelho colorido POR BAIXO ──────────────────
     ⭐⭐ O truque do ESPELHO. Um `<input>` não aceita span colorido dentro, e a
     palavra inválida precisa sair em vermelho. Então o texto do input fica
     TRANSPARENTE (só o cursor aparece) e um `<div>` idêntico atrás desenha o
     mesmo texto em pedaços coloridos.
     ⚠️⚠️ As duas camadas têm de ter EXATAMENTE a mesma métrica — fonte,
     tamanho, padding, borda, espaçamento. Um pixel de diferença e a cor sai
     fora de registro com o cursor, que é pior que não colorir nada. Por isso
     as propriedades comuns saem de uma regra só. */
  .ren-campo { position: relative; }
  .ren-campo .ren-espelho,
  .ren-campo input {
    font: 12px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
    padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius);
    letter-spacing: 0; white-space: pre; box-sizing: border-box; width: 100%;
  }
  .ren-campo .ren-espelho {
    position: absolute; inset: 0; background: var(--panel-2); color: var(--fg);
    overflow: hidden; pointer-events: none; border-color: transparent;
  }
  .ren-campo input {
    position: relative; background: transparent; color: transparent;
    caret-color: var(--fg);
  }
  .ren-campo input:focus { outline: none; border-color: var(--accent-forte); }
  .ren-espelho .campo { color: var(--accent-forte); }
  /* ⭐⭐ A CAIXINHA da tag fechada — o formato que o autor pediu, do Resolve.
     ⚠️⚠️ E a razão de ela não ter padding HORIZONTAL: o espelho tem de casar
     caractere a caractere com o input que está por baixo. Qualquer padding
     lateral empurraria o texto e o cursor apareceria fora de registro — que é
     pior que não desenhar caixa nenhuma. O respiro vem de graça: `%{` e `}` são
     caracteres REAIS, e ficam dentro da caixa fazendo as bordas.
     ⚠️ Os delimitadores saem apagados, não invisíveis: eles ocupam lugar no
     texto, e quem anda com a seta precisa ver onde a mão vai cair. */
  .ren-espelho .tag {
    background: color-mix(in srgb, var(--accent) 34%, transparent);
    border-radius: 3px; padding: 1px 0; color: var(--accent-forte);
  }
  .ren-espelho .tag .delim { color: var(--faint); }
  /* ⚠️ Sublinhado, e não só cor: a cauda que o motor devolveu ao literal (`_T`
     em `%shoot_T`) é uma DECISÃO dele sobre o que o editor digitou, e decisão
     calada é o que este projeto não aceita. */
  .ren-espelho .cauda { color: var(--muted); text-decoration: underline dotted; }
  .ren-espelho .ruim { color: var(--err); text-decoration: underline wavy var(--err); }

  /* ── o autocomplete ──────────────────────────────────────────────────────── */
  .ren-sugestoes {
    position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px);
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  .ren-sugestoes button {
    display: flex; align-items: baseline; gap: var(--s1);
    width: 100%; text-align: left; padding: 5px 8px;
    background: none; border: 0; color: var(--fg); font: inherit; font-size: 12px;
    cursor: pointer;
  }
  .ren-sugestoes button:hover,
  .ren-sugestoes button.marcada { background: var(--accent); color: var(--accent-ink); }
  .ren-sugestoes .sug-nome { font-family: ui-monospace, Consolas, monospace; }
  .ren-sugestoes .sug-rotulo { color: var(--muted); font-size: 11px; }
  .ren-sugestoes .sug-exemplo {
    margin-left: auto; color: var(--faint); font-size: 10px; font-style: italic;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%;
  }
  /* ⚠️ O campo DERIVADO é marcado: o editor tem de saber se aquilo foi LIDO da
     bin ou CALCULADO por nós. */
  .ren-sugestoes .sug-derivado { color: var(--warn); font-size: 10px; }

  /* ── os cards de atalho ──────────────────────────────────────────────────── */
  .ren-cards { display: flex; flex-wrap: wrap; gap: 4px; margin-top: var(--s1); }
  .ren-cards button {
    padding: 3px 7px; background: var(--panel-2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 999px;
    font: 11px/1.3 ui-monospace, Consolas, monospace; cursor: pointer;
  }
  .ren-cards button:hover { border-color: var(--accent-forte); color: var(--accent-forte); }
  /* ⭐ O campo que vem do NOSSO histórico, e não do material. Cor própria porque
     a natureza é outra: se o histórico sumir, o valor some junto — o que nenhum
     campo medido nem derivado faz. É o mesmo âmbar que já marca "presumido" na
     tabela, pela mesma razão: procedência é requisito, não enfeite. */
  .ren-cards button.historico { color: var(--warn); border-color: var(--warn); }
  .ren-cards button.historico:hover { background: rgba(217,169,90,.12); }
  .ren-sugestoes .sug-historico { color: var(--warn); font-size: 10px; }
  .ren-nota { margin: var(--s1) 0 0; font-size: 11px; color: var(--faint); }

  /* ── a lista de tomadas: selecionar, editar a cena, remover ─────────────── */
  .lista-acoes { display: flex; gap: 6px; align-items: center; margin-bottom: var(--s1); }
  .lista-acoes input {
    flex: 0 1 130px; background: var(--panel-2); color: var(--fg);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px 8px; font-size: 12px;
  }
  .lista-acoes button {
    padding: 5px 10px; background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 12px; cursor: pointer; flex: none;
  }
  .lista-acoes button:disabled { opacity: .45; cursor: default; }
  .lista-acoes button.discreto { background: none; color: var(--muted); }
  .lista-acoes button.discreto:hover:not(:disabled) { color: var(--err); border-color: var(--err); }
  .lista-acoes .cresce { flex: 1 1 auto; }

  .takes th.col-x, .takes td.col-x { width: 20px; padding: 0 4px; text-align: right; }
  /* ⭐ O cabeçalho ORDENA, e por isso se comporta como botão: cursor de mão e
     realce no hover. Uma coluna que ordena sem parecer clicável não é
     descoberta — é adivinhada. */
  .takes th.ordena { cursor: pointer; user-select: none; white-space: nowrap; }
  .takes th.ordena:hover { color: var(--fg); }
  .takes th.ordena.ativa { color: var(--accent-forte); }
  .takes th .seta { font-size: 9px; margin-left: 3px; }
  /* ⚠️ A lista inteira vira alvo de clique — a seleção agora é a do Explorer/
     Finder, e não mais uma caixa por linha. `user-select: none` porque
     shift+clique numa tabela selecionaria TEXTO, e o editor veria a página
     inteira pintada de azul em vez das linhas que escolheu. */
  .takes tbody tr { cursor: default; user-select: none; }
  /* ⚠️ O X é sempre visível, não só no hover: escondê-lo atrás do ponteiro faz
     o editor descobrir a função por acidente — ou não descobrir. */
  .takes td.col-x button {
    background: none; border: 0; color: var(--faint); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 2px 3px;
  }
  .takes td.col-x button:hover { color: var(--err); }
  .takes tr.marcada td { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  /* ⭐ A cena posta à MÃO se distingue da lida — mesma razão de "presumida". */
  .takes td.cena-manual { color: var(--accent-forte); }
  /* ⚠️ O nome que NÃO veio do padrão — caiu no de origem porque o material não
     tinha o campo. Mesmo âmbar de "presumida" e do campo do histórico, pela
     mesma razão: é a cor da procedência incerta. */
  .takes td.nome-origem { color: var(--warn); }

  label.chk { display: flex; gap: 6px; align-items: center; font-size: 12px;
              color: var(--muted); margin-bottom: var(--s2); cursor: pointer; }
  label.chk input { margin: 0; }

  button.act {
    display: block; width: 100%; text-align: left; margin-bottom: 8px;
    background: #3a3a3a; color: #eee; border: 1px solid #5a5a5a; border-radius: 6px;
    padding: 11px 13px; font-size: 13px; cursor: pointer;
  }
  button.act:hover:not(:disabled) { background: #454545; }
  button.act:disabled { opacity: .45; cursor: default; }
  button.act.primary { background: var(--accent-escuro); border-color: var(--accent); }
  button.act.primary:hover:not(:disabled) { background: #35558c; }
  .hint { color: #8d8d8d; font-size: 11px; line-height: 1.4; margin: -4px 0 12px; }
  .path { color: #7f7f7f; font-size: 11px; word-break: break-all; margin: -2px 0 12px; }
  #msg { font-size: 12px; min-height: 16px; line-height: 1.4; margin-top: 4px; }
  #msg.ok { color: #7ec97e; } #msg.er { color: #e08080; }

  .bloco { margin-bottom: 5px; }

  select, input[type=text] {
    width: 100%; background: #333; color: #eee; border: 1px solid #5a5a5a;
    border-radius: 5px; padding: 7px 8px; font-size: 12px; margin-bottom: 10px;
  }
  /* progresso — a mesma leitura do painel do Premiere: barra, etapa, tempo */
  /* ⭐⭐ STICKY, e isto é conserto de um defeito de USO, não estética.
     A barra já morou dentro do `#formSync` (invisível na leitura de seleção, que é
     quando não há fontes) e depois no topo do documento — de onde ela sai da vista
     assim que a lista de fontes cresce, porque o botão Sincronizar fica no rodapé e
     o editor rola até lá para clicar. Nos dois casos o trabalho acontecia e a tela
     não dizia nada.
     ⚠️ É a armadilha nº 4 do `arrastar.md`: num painel estreito, "não aconteceu
     nada" e "a resposta apareceu onde você não olha" são indistinguíveis para quem
     está usando — e ali ela custou metade do tempo de depuração.
     Grudada no topo, a barra vale para QUALQUER trabalho e não sai da vista.
     As margens negativas compensam o `padding` do `body`: sem elas o fundo cobre só
     a coluna de texto e o conteúdo aparece rolando pelas beiradas. */
  #prog {
    position: sticky; top: 0; z-index: 5;
    background: #2b2b2b;
    margin: 0 -14px 12px; padding: 10px 14px;
    box-shadow: 0 4px 8px -4px rgba(0, 0, 0, .55);
  }
  #barra { height: 5px; background: #333; border-radius: 3px; overflow: hidden; }
  #barraFill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  /* ⭐ A BARRA INDETERMINADA — o estado "trabalhando, ainda não sei quanto falta".
     Reportado pelo autor em 2026-08-22 no MC: durante a espera pelo motor a barra
     ficava parada em 0% com um rótulo estático, e ele se perguntou se tinha
     travado. Não tinha — mas 9 s de 0% e nada se mexendo dizem "travou", e é a
     tela que está errada, não a leitura de quem olha.
     Mostrar uma porcentagem inventada seria pior (ver a regra da base de conhecimento interna:
     número medido é dado, número inventado é veredito). Uma faixa que ANDA diz
     "vivo" sem afirmar progresso nenhum. */
  #barraFill.indeterminado {
    width: 100%;
    background: linear-gradient(90deg,
      #333 0%, #333 25%, var(--accent) 50%, #333 75%, #333 100%);
    background-size: 250% 100%;
    animation: correndo 1.15s linear infinite;
    transition: none;
  }
  @keyframes correndo { from { background-position: 100% 0; } to { background-position: -60% 0; } }
  /* Quem prefere menos movimento continua vendo que há algo em curso — só sem
     a animação. */
  @media (prefers-reduced-motion: reduce) {
    #barraFill.indeterminado { animation: none; background: #3a4a63; }
  }
  #progLinha { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; }
  #progEtapa { color: #bbb; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #progPct { color: #eee; font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
  #progTempo { color: #8d8d8d; font-size: 11px; margin-top: 2px; }

  /* ⭐ O REALCE DO ARRASTO. A janela INTEIRA é o alvo, não uma caixinha: mirar um
     alvo pequeno com o mouse segurando um clipe é trabalho, e num painel estreito
     uma zona dedicada roubaria espaço do que já está lá. O realce é o que diz que
     a janela aceita — sem ele o editor não tem como saber antes de soltar.
     `pointer-events: none` para o véu não roubar o próprio evento de drop. */
  body.arrastando::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    border: 2px dashed var(--accent-borda); background: rgba(var(--accent-rgb), .13);
    border-radius: 4px;
  }
  /* ⭐ O RODAPÉ da janela do app (2026-10-21): o Sincronizar e a assinatura (o Studio saiu em 2026-11-07). Só existe com
     `?casca=app` — dentro do Media Composer o painel não tinha o que abrir. */
  #rodape {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 8px;
    padding: 10px 14px 8px; background: #242424; border-top: 1px solid #3f3f3f;
  }

  #rodapeSync .act { width: 100%; margin: 0; padding: 11px 14px; font-size: 14px; }

  #assinatura { margin-left: auto; align-self: center; color: #6f6f6f;

     elas são a única forma de chegar ao trabalho. O crédito continua no ⚙ e no
     rodapé da janela do app — não se perde, muda de lugar. */
  @media (max-width: 460px) { #assinatura { display: none; } }

     uma terceira aba, com padding de aba e sublinhado de seleção. */
  #assinatura button {
    color: #6f6f6f; font-size: 10px; font-weight: 600; padding: 0; border: 0;

  #perguntaBotoes { display: flex; gap: 8px; }

  /* ⭐ EMBUTIDO no guarda-chuva do Ciclo Assist (`?embutido=1`, 2026-10-21): a moldura é dele — o estado da conexão
     e o pino no topo, a engrenagem à direita das abas Preparar · Assistir · Conformar · Entregar, a assinatura no
     rodapé. Aqui somem a barra de conexão, a aba ⚙ (a engrenagem de lá chama `cicloEmbutido.configuracoes()`) e a
     linha da assinatura; ficam as subabas Órbita · Subclipar · Renomear e o Sincronizar.
     ⭐⭐ As SUBABAS têm a MESMA medida nos três apps do guarda-chuva (autor, 2026-10-21) — a régua é a do De Lá Pra
     Cá: barra recuada 11 px com a linha de 1 px e 10 px antes do conteúdo; botão de 12 px em negrito com 8 × 12 px;
     a ativa clara e sublinhada no verde-água do guarda-chuva. As três cópias andam juntas. */
  /* ⭐ `?ajustes=1`: só os ajustes, na janela de configurações do Ciclo Assist (autor, 2026-11-07). */
  .so-ajustes nav, .so-ajustes #rodape { display: none !important; }
  /* ⭐ A janela larga (2026-11-07): o respiro da janela de configurações e uma coluna legível. */
  /* `html.` à frente: o `.embutido body` (o padding da aba) vem depois no CSS e venceria um seletor igual */
  html.so-ajustes body { padding: 22px 28px 28px; }

  .so-ajustes #secSettings button.act { width: auto; min-width: 220px; }
  .so-ajustes #secSettings h2:not(:first-child) { margin-top: 24px; padding-top: 16px; border-top: 1px solid #333; }
  .embutido #status, .embutido #tabSettings, .embutido nav #assinatura,
  .embutido #rodape .barra-assinatura { display: none !important; }

  /* ⛔ A faixa de progresso compensa o padding lateral do `body` (ver `#prog`): com os 14 px do painel solto, embutida
     ela estourava 3 px de cada lado e a página ganhava uma barra de rolagem horizontal enquanto havia trabalho. */
  .embutido #prog { margin: 0 -11px 12px; padding: 10px 11px; }

  .embutido nav button { padding: 8px 12px; margin-bottom: -1px; font: 600 12px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
                         color: #bcbcbc; border-bottom: 2px solid transparent; }
  .embutido nav button:hover { color: #e2e2e2; }

  /* ⭐ E a cor de AÇÃO é a do guarda-chuva (autor, 2026-10-29): sozinho o Órbita é azul; embutido, verde-água — a

              --accent-escuro:#1f5f59; --accent-borda:#4cc4b8; --accent-rgb:42, 127, 119; }

  /* ══ As origens (redesenho de 2026-11-08): caixas tracejadas que viram cards ══ */

<script>
(function () {

  // ⭐ Caminhos RELATIVOS. A página é servida pelo próprio Órbita, então "" já é a

  var BATIDA_MS = 4000;
  // ⭐ Na JANELA DO APP (o Órbita Painel, 2026-10-21) a página é a mesma, com outra
  // casca: ela fala com o NLE que estiver aberto (Premiere pela ponte, Media Composer
  // pelo motor) e recebe o arrasto pelo alvo nativo (`window.sincArrasto`).
  var CASCA_APP = typeof location !== "undefined" && /[?&]casca=app(&|$)/.test(location.search);
  // dentro do guarda-chuva do Ciclo Assist (ver o CSS `.embutido` e o fim do script)
  var EMBUTIDO = typeof location !== "undefined" && /[?&]embutido=1(&|$)/.test(location.search);
  // ⭐ `?ajustes=1`: a seção Preparar da janela de configurações do Ciclo Assist (autor, 2026-11-07) — só os ajustes.
  // ⛔⛔ E esta cópia NUNCA pede trabalho à fila `/nlejob`: quem tira o trabalho executa, e a montagem é da aba
  // Preparar da janela principal. Duas páginas pedindo, uma roubaria o trabalho da outra.
  var AJUSTES = typeof location !== "undefined" && /[?&]ajustes=1(&|$)/.test(location.search);

  var DIC = (window.SINC_I18N || {});
  // ⭐⭐ O IDIOMA VEM DO APP, e não do navegador.
  //
  // ⚠️⚠️ Perguntar ao `navigator.language` aqui parecia certo e não era: dentro do

    var respondeu = false;

  // As linhas do card: um clipe por linha, e o take de som monofônico numa linha só.
  function linhasDa(f) {
    var clipes = clipesDaFonte(f), porChave = {}, grupoDe = {};
    clipes.forEach(function (c) { porChave[c.chave] = c; });
    ((f.analise && f.analise.grupos) || []).forEach(function (g) {
      var dentro = g.filter(function (k) { return porChave[k]; });
      if (dentro.length >= 2) dentro.forEach(function (k) { grupoDe[k] = dentro; });
    });
    var vistos = {}, linhas = [], conflitos = (f.analise && f.analise.conflitos) || {};

    });
    if (f.ordem) {
      var col = COLUNAS[f.kind].filter(function (c) { return c.id === f.ordem.col; })[0];
      var sinal = f.ordem.desc ? -1 : 1;
      if (col) linhas.sort(function (a, b) {
        var x = col.val(a), y = col.val(b);
        var xv = x === null || x === undefined, yv = y === null || y === undefined;
        if (xv || yv) return xv === yv ? a.ordem - b.ordem : (xv ? 1 : -1);  // o que não se leu fica no fim, sempre
        var c = typeof x === "number" && typeof y === "number" ? x - y : AZ.compare(String(x), String(y));
        return (c * sinal) || (a.ordem - b.ordem);
      });
    }
    return linhas;
  }

  function celula(pai, tag, classe, txt) {
    var c = document.createElement(tag);
    if (classe) c.className = classe;
    if (txt !== undefined) { c.textContent = txt; c.title = txt; }
    pai.appendChild(c);
    return c;
  }

  function desenharTabela(f, linhas) {
    var tipo = f.kind;
    var tb = document.createElement("table");
    tb.className = "tab-origem";
    tb.dataset.tipo = tipo;
    var cg = document.createElement("colgroup");
    COLUNAS[tipo].concat([{}]).forEach(function () { cg.appendChild(document.createElement("col")); });
    tb.appendChild(cg);
    var th = document.createElement("thead"), tr = document.createElement("tr");
    COLUNAS[tipo].forEach(function (c) {
      var h = celula(tr, "th", "", undefined);
      h.dataset.col = c.id;
      h.title = t("panel.colSortHint");
      var ativa = f.ordem && f.ordem.col === c.id;
      h.textContent = t("panel." + c.rot) + (ativa ? (f.ordem.desc ? " ▾" : " ▴") : "");
      var alca = document.createElement("span");
      alca.className = "alca";
      alca.dataset.alca = c.id;
      alca.title = t("panel.colResizeHint");
      h.appendChild(alca);
    });
    celula(tr, "th", "col-x", "");
    th.appendChild(tr);
    tb.appendChild(th);

    var tc = document.createElement("tbody");
    linhas.forEach(function (l) {
      var linha = document.createElement("tr");
      if (l.conflitos.length) linha.className = "conflito";
      COLUNAS[tipo].forEach(function (c, i) {
        var bruto = l.ficha === undefined && i > 0 ? "…" : texto(c.txt(l));
        var td = celula(linha, "td", "", bruto);
        // os arquivos ficam no hover, para quem precisar auditar (no MC são ilegíveis de propósito)
        if (i === 0) td.title = l.arquivos.join("\n");
        if (l.ficha && l.ficha.presumida && (c.id === "cena" || c.id === "plano")) {
          td.className = "presumida";
          td.title = t("panel.scenePresumedHint");
        }
        if (i === 0 && l.grupo) {
          var selo = document.createElement("span");
          selo.className = "selo-mono";
          selo.textContent = t("panel.monoGroup", { n: l.grupo });
          td.appendChild(selo);
        }
        if (l.ficha && l.ficha.erro && i === 0) td.title = l.ficha.erro + "\n" + td.title;
      });
      var x = celula(linha, "td", "col-x");
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = "✕";
      b.title = t("panel.removeFile");
      b.addEventListener("click", function () { removerLinha(f, l); });
      x.appendChild(b);
      tc.appendChild(linha);
    });
    tb.appendChild(tc);
    return tb;
  }

  // ⭐ Tira o CLIPE INTEIRO, não uma trilha dele: tirar só o `_A02` de um OP-Atom deixaria um clipe sem um canal, um
  // estado que o editor não pediu e não veria.
  function removerLinha(f, l) {
    f.files = (f.files || []).filter(function (q) { return l.arquivos.indexOf(q) < 0; });
    if (!f.files.length) {
      fontes.splice(fontes.indexOf(f), 1);
      dizer(t("panel.emptySource"), true);
    } else {
      analisar(f);
    }
    desenharFontes();
  }

  function explicar(pai, linhas) {
    var tipos = {};
    linhas.forEach(function (l) { l.conflitos.forEach(function (c) { tipos[c] = true; }); });
    ["sobreposto", "zerado", "continuo"].forEach(function (c) {
      if (!tipos[c]) return;
      var p = document.createElement("div");
      p.className = "explica";
      p.textContent = t("panel.conflict." + c);
      pai.appendChild(p);
    });
  }

  function desenharCard(f, rotulo) {
    var indice = fontes.indexOf(f), linhas = linhasDa(f);
    var card = document.createElement("div");
    card.className = "card-origem";
    card.dataset.origem = f.kind;
    card.dataset.indice = indice;

    var cab = document.createElement("div");
    cab.className = "card-cab";
    var seta = document.createElement("button");
    seta.type = "button";
    seta.className = "card-seta";
    seta.textContent = f.aberta ? "▾" : "▸";
    seta.title = f.aberta ? t("panel.collapse") : t("panel.expand");
    function alternar() { f.aberta = !f.aberta; desenharFontes(); }
    seta.addEventListener("click", alternar);
    cab.appendChild(seta);
    var ic = document.createElement("span");
    ic.className = "card-icone";
    ic.appendChild(icone(f.kind === "sound" ? "sound" : "camera"));
    cab.appendChild(ic);
    var nome = document.createElement("span");
    nome.className = "card-nome";
    nome.textContent = rotulo;
    cab.appendChild(nome);
    var det = document.createElement("span");
    det.className = "card-det";
    var n = linhas.length;
    det.textContent = (n === 1 ? t("panel.clip") : t("panel.clips", { n: n })) + (f.label ? " · " + f.label : "");
    cab.appendChild(det);
    var emConflito = linhas.filter(function (l) { return l.conflitos.length; }).length;
    if (emConflito) {
      var alerta = document.createElement("span");
      alerta.className = "card-alerta";
      alerta.textContent = t("panel.inConflict", { n: emConflito });
      cab.appendChild(alerta);
    }
    cab.addEventListener("dblclick", alternar);
    // o ✕ fica na outra ponta, longe da seta, para evitar acidente
    var x = document.createElement("button");
    x.type = "button";
    x.className = "card-x";
    x.textContent = "✕";
    x.title = t("panel.remove");
    x.addEventListener("click", function (ev) {
      ev.stopPropagation();
      fontes.splice(fontes.indexOf(f), 1);
      desenharFontes();
    });
    cab.appendChild(x);
    card.appendChild(cab);

    if (f.aberta) {
      var rola = document.createElement("div");
      rola.className = "tabela-origem";
      rola.dataset.rola = indice;
      rola.appendChild(desenharTabela(f, linhas));
      card.appendChild(rola);
      explicar(card, linhas);
    }
    return card;
  }

  function caixaVazia(tipo) {
    var c = document.createElement("div");
    c.className = "caixa-origem";
    c.dataset.origem = tipo;
    c.dataset.indice = "";
    var ic = document.createElement("span");
    ic.className = "card-icone";
    ic.appendChild(icone(tipo));
    c.appendChild(ic);
    var s = document.createElement("span");
    s.textContent = t(tipo === "sound" ? "panel.addSound" : "panel.addCamera");
    c.appendChild(s);
    return c;
  }

  function desenharFontes() {
    var box = $("fontes");
    // redesenhar a cada lote de fichas não pode levar o editor de volta ao topo da lista
    Array.prototype.forEach.call(box.querySelectorAll("[data-rola]"), function (r) {
      var f = fontes[Number(r.dataset.rola)];
      if (f) f.rolagem = { x: r.scrollLeft, y: r.scrollTop };
    });
    box.textContent = "";
    $("formSync").hidden = fontes.length === 0;
    var rots = rotulos();
    var cameras = [], sons = [];
    fontes.forEach(function (f, i) { (f.kind === "sound" ? sons : cameras).push({ f: f, rot: rots[i] }); });
    // ⭐ A caixa de câmera nasce ACIMA dos cards, e a de som ABAIXO: as duas sempre à mão, com o material no meio.
    box.appendChild(caixaVazia("camera"));
    cameras.slice().reverse().forEach(function (o) { box.appendChild(desenharCard(o.f, o.rot)); });
    sons.forEach(function (o) { box.appendChild(desenharCard(o.f, o.rot)); });
    box.appendChild(caixaVazia("sound"));
    aplicarLarguras("camera");
    aplicarLarguras("sound");
    Array.prototype.forEach.call(box.querySelectorAll("[data-rola]"), function (r) {
      var f = fontes[Number(r.dataset.rola)];
      if (f && f.rolagem) { r.scrollLeft = f.rolagem.x; r.scrollTop = f.rolagem.y; }
    });
    pintarTimeline();
  }

  // ── colunas: a divisa muda a largura, o duplo clique no título ordena ───────
  var arrastoCol = null;
  $("fontes").addEventListener("mousedown", function (ev) {
    var alca = ev.target.closest && ev.target.closest("[data-alca]");
    if (!alca) return;
    ev.preventDefault();
    var tipo = alca.closest("table").dataset.tipo;
    var c = COLUNAS[tipo].filter(function (k) { return k.id === alca.dataset.alca; })[0];
    arrastoCol = { tipo: tipo, c: c, x0: ev.clientX, w0: larguraDe(tipo, c) };
    document.body.classList.add("redimensionando");
  });
  document.addEventListener("mousemove", function (ev) {
    if (!arrastoCol) return;
    larguras[arrastoCol.tipo][arrastoCol.c.id] =
      Math.max(LARGURA_MINIMA, Math.round(arrastoCol.w0 + ev.clientX - arrastoCol.x0));
    aplicarLarguras(arrastoCol.tipo);
  });
  document.addEventListener("mouseup", function () {
    if (!arrastoCol) return;
    arrastoCol = null;
    document.body.classList.remove("redimensionando");
    guardarLarguras();
  });
  $("fontes").addEventListener("dblclick", function (ev) {
    var alvo = ev.target.closest && ev.target.closest("thead th");
    if (!alvo) return;
    var card = alvo.closest(".card-origem"), f = fontes[Number(card.dataset.indice)];
    var alca = ev.target.closest("[data-alca]");
    if (alca) {  // duplo clique na divisa: a largura de fábrica
      delete larguras[f.kind][alca.dataset.alca];
      aplicarLarguras(f.kind);
      guardarLarguras();
      return;
    }
    if (!alvo.dataset.col) return;
    f.ordem = f.ordem && f.ordem.col === alvo.dataset.col
      ? { col: alvo.dataset.col, desc: !f.ordem.desc } : { col: alvo.dataset.col, desc: false };
    desenharFontes();
  });

  // ⭐ OS CLIPES DE UMA FONTE, com o nome que o editor reconhece: em mídia gerenciada um clipe são vários `.mxf`
  // (`V01.E69C…`, `A01.E69C…`), e a lista por arquivo era ilegível (autor, 2026-08-23). Sem `mobIds` cai no nome do
  // arquivo: feio, mas honesto.
  function clipesDaFonte(f) {
    var arquivos = f.files || [];
    var porMob = {}, ordem = [];
    arquivos.forEach(function (caminho) {
      var chave = (mobIds && mobIds[caminho]) || caminho;
      if (!porMob[chave]) {
        porMob[chave] = { chave: chave, arquivos: [], rotulo: null };
        ordem.push(chave);
      }
      porMob[chave].arquivos.push(caminho);
      if (!porMob[chave].rotulo) {
        porMob[chave].rotulo = (mobNames && mobNames[caminho]) || nomeDoArquivo(caminho);
      }
    });
    return ordem.map(function (k) { return porMob[k]; });
  }

  function nomeDoArquivo(caminho) {
    var partes = String(caminho).split(/[\\/]/);
    return partes[partes.length - 1] || caminho;
  }

  // ── as fichas: um lote pequeno por vez, sem travar o arrasto ─────────────────
  var LOTE_DE_FICHAS = 6, fichasPedidas = {}, bombaLigada = false;

  // O projeto aberto: é por ele que se acha a memória da produção (`media/memoria_da_producao.py`).
  function projetoAtual() {
    if (modoNle === "premiere") return nomeDoArquivoDeProjeto((estadoPremiere || "").split("\t")[1] || "");
    return nomeDoProjeto || "";
  }

  function bombearFichas() {
    if (bombaLigada) return;
    var lote = [];
    fontes.forEach(function (f) {
      clipesDaFonte(f).forEach(function (c) {
        if (lote.length >= LOTE_DE_FICHAS || fichas[c.chave] || fichasPedidas[c.chave]) return;
        fichasPedidas[c.chave] = true;
        lote.push({ id: c.chave, arquivos: c.arquivos, tipo: f.kind, nome: c.rotulo });
      });
    });
    if (!lote.length) return;
    bombaLigada = true;
    postJson("/midia/fichas", { clipes: lote, projeto: projetoAtual() })
      .then(function (j) { (j.fichas || []).forEach(function (fi) { fichas[fi.id] = fi; }); })
      .catch(function (e) { lote.forEach(function (c) { fichas[c.id] = { id: c.id, erro: e.message }; }); })
      .then(function () {
        bombaLigada = false;
        fontes.forEach(analisar);
        pintarMidiaNaTimeline();
        desenharFontes();
        bombearFichas();
      });
  }

  // ⭐ Os conflitos e os takes monofônicos, por card. A assinatura evita perguntar de novo o que não mudou.
  function analisar(f) {
    var itens = clipesDaFonte(f).filter(function (c) { return fichas[c.chave] && !fichas[c.chave].erro; })
      .map(function (c) { return Object.assign({}, fichas[c.chave], { id: c.chave, nome: c.rotulo }); });
    var assinatura = itens.map(function (i) { return i.id; }).join("|");
    if (f.assinatura === assinatura) return;
    f.assinatura = assinatura;
    postJson("/midia/analise", { fichas: itens })
      .then(function (j) { if (f.assinatura === assinatura) { f.analise = j; desenharFontes(); } })
      .catch(function () { /* sem análise o card só deixa de avisar; as linhas continuam */ });
  }

  // ── entregar o que veio do arrasto à caixa certa ─────────────────────────────
  // ⭐ Áudio solto = só áudio de verdade: `.wav`/`.aiff`/`.mp3`/`.aac` no Premiere e, no MC (tudo `.mxf`), o master só
  // com trilhas de som. Vídeo com áudio embutido é câmera e não pergunta nada.
  var EXTENSAO_DE_AUDIO = /\.(wav|aiff?|mp3|aac)$/i;
  var alvoDoSoltar = null;

  function alvoEm(x, y) {
    if (typeof x !== "number" || typeof y !== "number") return null;
    var el = document.elementFromPoint(x, y);
    var c = el && el.closest ? el.closest("[data-origem]") : null;
    if (!c) return null;
    return { tipo: c.dataset.origem, fonte: c.dataset.indice === "" ? null : fontes[Number(c.dataset.indice)] };
  }

  function marcarAlvo(x, y) {
    var acesa = document.querySelector("[data-origem].alvo");
    var alvo = alvoEm(x, y);
    var el = alvo ? document.elementFromPoint(x, y).closest("[data-origem]") : null;
    if (acesa && acesa !== el) acesa.classList.remove("alvo");
    if (el) el.classList.add("alvo");
  }

  function jaNaLista() {
    var tem = {};
    fontes.forEach(function (f) { (f.files || []).forEach(function (c) { tem[c] = true; }); });
    return tem;
  }

  // Soltar num card soma a ele; soltar na caixa tracejada abre um card novo. `paths` nunca repete o que já está na lista.
  function porNoCard(kind, fonte, paths, label) {
    if (!paths.length) return 0;
    if (fonte) { fonte.files = (fonte.files || []).concat(paths); return paths.length; }
    fontes.push({ kind: kind, label: label || null, files: paths });
    return paths.length;
  }

  function pergunta(texto, botoes) {
    var modal = $("pergunta");
    $("perguntaTexto").textContent = texto;
    var fila = $("perguntaBotoes");
    fila.textContent = "";
    botoes.forEach(function (b) {
      var bt = document.createElement("button");
      bt.type = "button";
      bt.className = "act" + (b.primario ? " primary" : "");
      bt.textContent = b.texto;
      bt.addEventListener("click", function () { modal.hidden = true; b.fazer(); });
      fila.appendChild(bt);
    });
    modal.hidden = false;
  }

  /**
   * `video` e `audio`: listas de caminhos do que veio, já separadas. O alvo diz o que a caixa aceita, e o que não cabe nela
   * é recusado com a frase de onde soltar (decisões 2 e 4 do plano).
   */
  function entregar(alvo, video, audio, label, avisos) {
    avisos = avisos || [];
    var tem = jaNaLista(), repetidos = 0;
    function novos(lista) {
      return lista.filter(function (c) {
        if (tem[c]) { repetidos++; return false; }
        tem[c] = true;
        return true;
      });
    }
    var eCamera = alvo.tipo === "camera";
    var doTipo = eCamera ? video : audio, doOutro = eCamera ? audio : video;

    function concluir(entraram) {
      if (entraram) avisos.unshift(t("panel.dropAdded", { n: entraram }));
      if (repetidos) avisos.push(t("panel.duplicates", { n: repetidos }));
      if (!avisos.length) avisos.push(t("panel.nothingNew"));
      desenharFontes();
      bombearFichas();
      fontes.forEach(analisar);
      dizer(avisos.join(" "), !!entraram);
    }

    if (!doTipo.length) {
      dizer(t(eCamera ? "drop.audioInCamera" : "drop.videoInSound"), false);
      return;
    }
    if (!doOutro.length) {
      concluir(porNoCard(alvo.tipo, alvo.fonte, novos(doTipo), label));
      return;
    }
    pergunta(t("panel.askSeparate"), [
      { texto: t("panel.yes"), primario: true, fazer: function () {
        var n = porNoCard(alvo.tipo, alvo.fonte, novos(doTipo), label);
        n += porNoCard(eCamera ? "sound" : "camera", null, novos(doOutro), label);
        concluir(n);
      } },
      { texto: t("panel.no"), fazer: function () { concluir(porNoCard(alvo.tipo, alvo.fonte, novos(doTipo), label)); } },
      { texto: t("panel.cancel"), fazer: function () { dizer("", true); } }
    ]);
  }

  // O painel do Avid não tem `openURLInDefaultBrowser` (isso é do CEP), então quem
  // abre o navegador é o app. A rota aceita APELIDO, não URL — ver `wanted_link`.
  $("autor").addEventListener("click", function () {
    fetch("/link/open", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ which: "author" })
    }).catch(function () { /* sem link aberto, e sem barulho: é um crédito */ });
  });

  // ── sincronizar ─────────────────────────────────────────────────────────────
  var poll = null;

  function clipesDasFontes() {
    var rots = rotulos(), clips = [];
    fontes.forEach(function (f, i) {
      var primeiroDe = {};   // um take mono: só o 1º canal entra no sync; os outros voltam na posição dele (`fichas.py`)
      ((f.analise && f.analise.grupos) || []).forEach(function (g) {
        var porChave = {};
        clipesDaFonte(f).forEach(function (c) { porChave[c.chave] = c; });
        g.slice(1).forEach(function (k) {
          if (porChave[k] && porChave[g[0]]) primeiroDe[porChave[k].arquivos[0]] = porChave[g[0]].arquivos[0];
        });
      });
      (f.files || []).forEach(function (caminho, ordem) {
        var c = { path: caminho, group: rots[i], group_order: ordem };
        if (f.kind === "sound") c.kind = "sound";
        if (primeiroDe[caminho]) c.mono_de = primeiroDe[caminho];
        clips.push(c);
      });
    });
    return clips;
  }

  // ⭐ A MESMA LEITURA do painel do Premiere: barra, o QUE está acontecendo, e o
  // TEMPO. O sync de uma diária leva minutos — sem etapa e sem relógio, a barra
  // sozinha é indistinguível de um travamento.
  function progresso(st) {
    if (st == null) { $("prog").hidden = true; return; }
    $("prog").hidden = false;
    // ⭐ SEM FRAÇÃO AINDA = barra indeterminada, não barra em 0%.
    // O job nasce `waiting` e só emite fração quando o motor começa a responder;
    // até lá, uma barra parada em 0% é indistinguível de um travamento (relatado
    // no MC em 2026-08-22, com 9 s de espera). A faixa que anda diz "vivo" sem
    // inventar progresso.
    var frac = st.fraction || 0;
    var indeterminado = st.state === "waiting" || frac <= 0;
    var fill = $("barraFill");
    fill.classList.toggle("indeterminado", indeterminado);
    var pct = Math.round(frac * 100);
    if (indeterminado) {
      fill.style.width = "";          // a classe manda; largura inline atrapalharia
      $("progPct").textContent = "";  // "0%" parado é a própria mensagem de travado
    } else {
      fill.style.width = pct + "%";
      $("progPct").textContent = pct + "%";
    }
    $("progEtapa").textContent =
      st.state === "waiting" ? t("panel.waiting") : (st.stage || "");
    var ms = st.elapsed_ms || 0;
    var linha = t("panel.elapsed", { t: relogio(ms) });
    // ETA só quando já há fração suficiente para a conta não ser fantasia — e só
    // quando quem chamou diz que o relógio cobre a barra inteira (ver `acompanhar`).
    if (st.eta && (st.fraction || 0) > 0.05 && (st.fraction || 0) < 1) {
      var falta = (ms / st.fraction) - ms;
      linha += " " + t("panel.remaining", { t: relogio(falta) });
    }
    $("progTempo").textContent = linha;
  }

  function relogio(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(s / 60);
    return m + ":" + String(s % 60).padStart(2, "0");
  }

  // ⭐ O botão faz DUAS coisas em sequência — sincronizar e montar a bin —, e as
  // duas são jobs separados no servidor. Para quem olha é uma espera só, então as
  // faixas se encadeiam: o sync ocupa 0-90% da barra e a montagem os 10% finais.
  var FAIXA_SYNC = [0, 0.9], FAIXA_MONTAGEM = [0.9, 1];

  $("btSync").addEventListener("click", function () {
    if (fontes.length < 2) { dizer(t("panel.needTwo"), false); return; }
    if (formatoDaTimeline() === false) { dizer(t("panel.timelineInvalid"), false); return; }
    var bt = $("btSync"), original = bt.textContent;
    bt.disabled = true; bt.textContent = t("panel.syncing");
    dizer("", true);
    progresso({ fraction: 0, state: "waiting", elapsed_ms: 0, eta: true });

    function falhou(e) {
      progresso(null); bt.textContent = original; bt.disabled = false;
      dizer(t("result.failed", { msg: e.message }), false);
    }

    comJob("/syncmap",
      { clips: clipesDasFontes(), method: $("metodo").value },
      FAIXA_SYNC,
      function (result) {
        if (CASCA_APP && modoNle === "premiere") { montarNoPremiere(result, bt, original); }
        else { montar(result, bt, original); }
      },
      falhou);
  });

  // O motor responde por polling, como no painel do Premiere: o job é longo e o
  // servidor não empurra evento para o plugin.
  //
  // ⭐ TODAS as rotas longas do painel são job: `/avid/selecao`, `/syncmap` e
  // `/avid/montar` devolvem `{job_id}` na hora e o trabalho corre numa thread do
  // app. Não é preferência de estilo — o accept loop do servidor é de UMA thread
  // só, e o handler síncrono que a leitura de seleção usava congelava a ponte
  // inteira (inclusive a batida deste painel e os outros dois NLEs) enquanto o
  // Media Composer era consultado bin a bin.
  //
  // `faixa` = `[lo, hi]`: onde a fração DESTE job cai na barra que o editor vê.
  // Sincronizar e montar são dois jobs no servidor, mas UM botão e UMA espera para
  // quem olha — sem a faixa a barra chegava a 100% no fim do sync e voltava a zero
  // para a montagem, que é justamente a leitura de "travou e recomeçou" que a
  // faixa de fases do motor existe para evitar.
  function acompanhar(jobId, faixa, aoConcluir, aoFalhar) {
    clearTimeout(poll);
    var lo = faixa[0], hi = faixa[1];
    fetch("/prproj/status?id=" + encodeURIComponent(jobId))
      .then(function (r) { return r.json(); })
      .then(function (st) {
        if (st.error) throw new Error(st.error);
        // ⚠️ O status fala `fraction` (0..1) e `stage`, não `done`/`total` — a
        // primeira versão olhava os campos errados e a barra nunca aparecia.
        progresso({
          state: st.state,
          stage: st.stage,
          elapsed_ms: st.elapsed_ms,
          fraction: lo + (st.fraction || 0) * (hi - lo),
          // ETA só quando o relógio do job cobre a barra INTEIRA. Numa faixa que
          // começa no meio, `elapsed_ms` conta só o job atual, e a conta diria
          // "faltam 2 s" com a barra em 90% — pior que não dizer nada.
          eta: lo === 0
        });
        if (st.state === "done") {
          progresso({ fraction: hi, stage: st.stage, elapsed_ms: st.elapsed_ms });
          aoConcluir(st.result);
          return;
        }
        poll = setTimeout(function () {
          acompanhar(jobId, faixa, aoConcluir, aoFalhar);
        }, 500);
      })
      .catch(aoFalhar);
  }

  // Dispara uma rota de job e acompanha até o fim. O corpo da resposta imediata é
  // só o `job_id`; o resultado de verdade chega pelo `acompanhar`.
  function comJob(rota, corpo, faixa, aoConcluir, aoFalhar) {
    fetch(rota, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo || {})
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        // O motor recusa um segundo trabalho em vez de enfileirá-lo mudo — ver
        // `reservar_job` no servidor.
        if (res.j && res.j.busy) throw new Error(t("panel.engineBusy"));
        if (!res.ok || !res.j.job_id) throw new Error(res.j.error || "HTTP");
        acompanhar(res.j.job_id, faixa, aoConcluir, aoFalhar);
      })
      .catch(aoFalhar);
  }

  // ── montar a bin no Media Composer ──────────────────────────────────────────
  // O app autora uma `.avb` e a abre: a timeline sai ONLINE e o `Find in Bin` leva ao
  // clipe na bin original. É o mesmo caminho do botão da janela, não um segundo.
  function montar(result, bt, textoOriginal) {
    bt.textContent = t("panel.building");

    function encerrar() {
      progresso(null);
      bt.textContent = textoOriginal;
      bt.disabled = false;
    }

    comJob("/avid/montar",
      {
        result: result,
        name: ($("seqNome").value || "").trim() || t("panel.seqNameDefault"),
        // ⭐ SEMPRE com o áudio das câmeras. A timeline de sync existe para ter tudo
        // à mão — o editor apaga o que não quiser, e isso é barato. Descartar por
        // padrão seria decidir por ele, e o que se perde não volta sem re-sincronizar.
        // A escolha de manter ou descartar vai fazer sentido em subclipes e merged
        // clips, onde o resultado é um objeto enxuto de propósito; aqui, não.
        include_camera_audio: true,
        mob_ids: mobIds,
        mob_lengths: mobLengths
      },
      FAIXA_MONTAGEM,
      function (res) {
        encerrar();
        res = res || {};
        dizer(t("panel.built", { n: res.count == null ? 1 : res.count }), true);
      },
      function (e) {
        encerrar();
        dizer(t("result.failed", { msg: e.message }), false);
      });
  }

  // ── aba ⚙ ────────────────────────────────────────────────────────────────────
  // ⭐ Só existe porque a página agora é same-origin: `/settings`, `/cache/clear` e
  // `/folder/open` exigem o token, e o painel `avpi://` não tinha como mandá-lo.
  // São as MESMAS rotas do painel do Premiere — não uma cópia do estado, o estado.
  // ⚠️ `/settings` passa pelo motor e tem `busy_guard`: com o sync rodando ela
  // responde ocupado, não os dados. Por isso não se marca "carregado" nesse caso —
  // senão a aba ficaria vazia até o painel ser reaberto.
  function carregarSettings() {
    if (ligado === false || ocupado) return;
    fetch("/settings")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || j.error) return;
        var partes = [];
        if (j.cache_dir) partes.push(t("panel.cacheLocation") + ": " + j.cache_dir);
        if (typeof j.cache_bytes === "number") {
          partes.push(tamanho(j.cache_bytes) + " · " + (j.cache_files || 0));
        }
        $("cachePath").textContent = partes.join("  —  ");
      })
      .catch(function () { /* a batida já reporta a queda */ });
  }

  // `Intl` faz o número; a unidade é escolhida aqui para não depender de locale.
  function tamanho(bytes) {
    var un = ["B", "KB", "MB", "GB", "TB"], i = 0, n = bytes;
    while (n >= 1024 && i < un.length - 1) { n /= 1024; i++; }
    return new Intl.NumberFormat(locale, { maximumFractionDigits: n < 10 ? 1 : 0 })
      .format(n) + " " + un[i];
  }

  function acaoSimples(rota, corpo, botao, textoDeSucesso, relerDepois) {
    var original = botao.textContent;
    botao.disabled = true;
    dizer("", true);
    fetch(rota, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo || {})
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        dizer(textoDeSucesso, true);
        // Limpar o cache muda o número que está na tela. Sem reler, a linha continua
        // dizendo 26 MB depois de o cache virar zero — e o usuário só descobre dando
        // Reload no painel.
        if (relerDepois) carregarSettings();
      })
      .catch(function (e) {
        dizer(t("result.failed", { msg: e.message }), false);
      })
      .then(function () {
        botao.textContent = original;
        botao.disabled = ligado === false || ocupado;
      });
  }

  $("btCache").addEventListener("click", function () {
    acaoSimples("/cache/clear", {}, $("btCache"), t("panel.cacheCleared"), true);
  });
  $("btLogs").addEventListener("click", function () {
    // `which` é o vocabulário que a rota entende — ela NÃO aceita caminho livre.
    acaoSimples("/folder/open", { which: "logs" }, $("btLogs"), t("panel.folderOpened"));
  });

  // ══════════════════════════════════════════════════════════════════════════
  //  ARRASTAR DA BIN PARA O PAINEL — o gesto principal
  // ══════════════════════════════════════════════════════════════════════════
  //
  // ⭐⭐ SUBSTITUI a leitura da seleção da bin, e o ganho é de PRECISÃO, não de
  // conforto: a seleção do Media Composer atravessa bins e permanece ativa, então
  // clipes esquecidos marcados em outra bin aberta entravam sem querer na lista — e
  // o editor só descobria pelo resultado do sync, longe da causa. O arrasto é um
  // gesto deliberado, e o que ele carrega é o que foi arrastado.
  //
  // De quebra é mais barato: o MobID vem no payload, sem o piso de ~500 ms por bin
  // do `GetListOfBinItems` — e sem depender do `GetListOfWindows`, que não existe no
  // MC 25.6.
  //
  // O mecanismo NÃO é declarado no manifesto e não é concedido: o Qt entrega o
  // arrasto à webview como MIME e quem implementa o resto é o Chromium. Ele
  // sobrevive à página ser servida por `http://` (medido). Ver `arrastar.md` no
  // a base de conhecimento interna, que corrige o registro anterior de que isto era impossível.
  var MIME_ASSETS_MC = "text/x.avid.mc-api-asset-list+json";

  function tiposDo(dt) {
    try { return Array.prototype.slice.call((dt && dt.types) || []); }
    catch (e) { return []; }
  }

  function temNossoMime(dt) {
    return tiposDo(dt).indexOf(MIME_ASSETS_MC) !== -1;
  }

  // ⚠️⚠️ NÃO force `dropEffect = "copy"`. **O Media Composer arrasta com
  // `effectAllowed = "move"`**, e um `dropEffect` fora do que a origem permite
  // CANCELA o drop — em silêncio. O sintoma é cruel: o realce aparece (o
  // `dragenter` viu o MIME) e soltar não faz nada. Foi este o defeito da primeira
  // versão no De Lá Pra Cá.
  //
  // O `"move"` do Avid é rótulo do protocolo de arrasto, não promessa de que algo
  // sai do lugar — nada é removido do projeto do editor.
  function efeitoCompativel(dt) {
    var permitido = (dt && dt.effectAllowed) || "all";
    if (permitido === "none") return null;
    if (permitido === "all" || permitido === "uninitialized") return "copy";
    var p = String(permitido).toLowerCase();
    if (p.indexOf("copy") !== -1) return "copy";
    if (p.indexOf("move") !== -1) return "move";
    if (p.indexOf("link") !== -1) return "link";
    return null;
  }

  // ⚠️ MobID se valida CONTANDO 64 hexadecimais, nunca casando os hifens: o
  // agrupamento muda conforme a superfície (`26-6-16-8-8` na API, `26-6-16-12-4` no
  // payload do arrasto). Um validador que crave a pontuação recusa MobID legítimo, e
  // o sintoma é "o clipe que arrastei não é reconhecido".
  function mobIdPlausivel(bruto) {
    if (typeof bruto !== "string") return false;
    var hex = bruto.match(/[0-9a-fA-F]/g);
    return !!hex && hex.length === 64;
  }

  // `dragenter`/`dragleave` disparam também ao cruzar cada FILHO do elemento, então
  // um booleano pisca sem parar. O contador é o remédio: só o zero significa que o
  // ponteiro saiu de verdade.
  var profundidadeArrasto = 0;

  // ⚠️ `classList`, nunca `className`: a mesma tag leva o `casca-app`, que o `className` apagava a cada arrasto.
  function realcar(ligar) {
    document.body.classList.toggle("arrastando", !!ligar);
  }

  function apagarAlvo() {
    var acesa = document.querySelector("[data-origem].alvo");
    if (acesa) acesa.classList.remove("alvo");
  }

  // ⚠️⚠️ FASE DE CAPTURA (`true` no fim), não a de bolha: `<select>` e
  // `<input type=text>` têm tratamento PRÓPRIO de drop e podem consumir o evento
  // antes de ele chegar ao documento. Na captura o alvo é a janela inteira de
  // verdade — e não "a janela inteira, menos os campos".
  //
  // ⚠️⚠️ E o `preventDefault` é INCONDICIONAL, não só quando o MIME é o nosso: sem
  // ele, soltar um ARQUIVO sobre o painel faz a webview NAVEGAR para o arquivo, a
  // interface desaparece e o editor fica olhando um `.mxf` cru sem entender o que
  // fez. O filtro de MIME decide o REALCE, nunca se o navegador assume o controle.
  document.addEventListener("dragenter", function (ev) {
    ev.preventDefault();
    profundidadeArrasto++;
    if (abaAtual !== "sources") realcar(temNossoMime(ev.dataTransfer));
  }, true);

  document.addEventListener("dragover", function (ev) {
    ev.preventDefault();
    if (!temNossoMime(ev.dataTransfer)) return;
    var efeito = efeitoCompativel(ev.dataTransfer);
    if (efeito) ev.dataTransfer.dropEffect = efeito;
    // `dragover` repete enquanto o arrasto está sobre a página, e é a rede contra um
    // `dragenter` engolido por um filho.
    if (abaAtual === "sources") { marcarAlvo(ev.clientX, ev.clientY); return; }
    realcar(true);
  }, true);

  document.addEventListener("dragleave", function () {
    profundidadeArrasto = Math.max(0, profundidadeArrasto - 1);
    if (profundidadeArrasto === 0) { realcar(false); apagarAlvo(); }
  }, true);

  // `dragend` cobre o arrasto ABANDONADO (Esc, ou soltar fora da janela), que não
  // dispara `drop` nenhum e deixaria o realce aceso para sempre.
  document.addEventListener("dragend", function () {
    profundidadeArrasto = 0;
    realcar(false);
    apagarAlvo();
  }, true);

  document.addEventListener("drop", function (ev) {
    ev.preventDefault();
    profundidadeArrasto = 0;
    realcar(false);
    apagarAlvo();
    alvoDoSoltar = abaAtual === "sources" ? alvoEm(ev.clientX, ev.clientY) : null;
    aoSoltar(ev.dataTransfer);
  }, true);

  function aoSoltar(dt) {
    // ⚠️ Só o evento `drop` entrega DADOS: durante `dragenter`/`dragover` o
    // navegador está em *protected mode* e `getData` devolve string vazia, mesmo com
    // o tipo listado em `types`.
    if (!temNossoMime(dt)) {
      // Soltar algo que não é da bin tem de produzir MENSAGEM, não silêncio —
      // "não aconteceu nada" e "a resposta apareceu onde você não olha" são
      // indistinguíveis para quem está usando.
      dizer(t("panel.dropUnknown"), false);
      return;
    }
    var itens;
    try { itens = JSON.parse(dt.getData(MIME_ASSETS_MC) || "[]"); }
    catch (e) { dizer(t("panel.dropUnreadable"), false); return; }
    if (!itens || !itens.length) { dizer(t("panel.dropEmpty"), false); return; }

    // ⚠️⚠️ CADA ABA ACEITA ESPÉCIES DIFERENTES, e o drop tem um destino só.
    //
    // Sincronizar quer masterclip (é o que tem arquivo de mídia por baixo);
    // Renomear aceita TUDO, porque `SetMobInfo` renomeia os quatro tipos — foi
    // medido, e é o que autoriza a aba sem filtro. Uma sequência arrastada na
    // aba errada não é payload defeituoso: é material bom no lugar errado, e a
    // recusa tem de dizer ONDE ele serve, senão manda o editor procurar defeito
    // onde não há.
    //
    // ⚠️ Um EFEITO vem com `type` **string vazia**, não com um nome: quem escrever
    // `if (!tipo)` para "não sei o que é" vai confundi-lo com payload defeituoso.
    var ACEITA = {
      sources: ["masterclip"],
      subclip: ["sequence"],
      rename: ["masterclip", "subclip", "sequence", "effect"]
    };
    var aceitas = ACEITA[abaAtual];
    if (!aceitas) {
      // Aba que ainda não recebe arrasto. Ignorar calado é indistinguível de um
      // painel travado — mas a recusa tem de ser a CERTA: mandar o editor para
      // outra aba, quando o que ele arrastou é exatamente o que ESTA vai
      // receber, é conselho errado com cara de ajuda.
      // Aba que não recebe arrasto (Ajustes). Ignorar calado é indistinguível
      // de um painel travado.
      dizer(t("drop.wrongTab", { tab: $(BOTAO.sources).textContent }), false);
      return;
    }

    var mobs = [], recusados = {};
    itens.forEach(function (it) {
      var tipo = (it && typeof it.type === "string") ? it.type : "?";
      var especie = tipo === "" ? "effect" : tipo;
      if (aceitas.indexOf(especie) >= 0 && mobIdPlausivel(it.id)) mobs.push(it.id);
      else recusados[especie] = (recusados[especie] || 0) + 1;
    });

    if (!mobs.length) {
      var especies = Object.keys(recusados).map(function (k) {
        return t("panel.species." + k) === "panel.species." + k ? k : t("panel.species." + k);
      });
      // ⭐ A recusa ENSINA: se o que veio serve NOUTRA aba, ela diz qual.
      var alhures = Object.keys(recusados).filter(function (k) {
        return ACEITA.rename.indexOf(k) >= 0;
      });
      if (abaAtual === "sources" && alhures.length === Object.keys(recusados).length) {
        // ⭐ Uma SEQUÊNCIA agora tem duas casas: Subclipar (o gesto principal) e
        // Renomear. Manda para a primeira — é o que o editor quase sempre quer
        // fazer com uma timeline sincronizada.
        // ⚠️ Mensagens DIFERENTES, porque as abas fazem coisas diferentes: dizer
        // "solte na aba Subclipar para mudar o nome" mandaria o editor para o
        // lugar certo pela razão errada.
        var soSequencia = Object.keys(recusados).length === 1 && recusados["sequence"];
        dizer(soSequencia
                ? t("drop.trySubclip", { tab: $("tabSubclip").textContent })
                : t("drop.tryRename", { what: especies.join(", "),
                                        tab: $("tabRename").textContent }),
              false);
      } else {
        dizer(t("panel.dropNoMasters", { what: especies.join(", ") }), false);
      }
      return;
    }

    if (abaAtual === "rename") { lerParaRenomear(mobs); return; }
    if (abaAtual === "subclip") { aoSoltarTimeline(mobs); return; }

    // ⭐ Sincronizar: a caixa onde soltou é quem diz o que aquilo é.
    var alvo = alvoDoSoltar;
    if (!alvo) { dizer(t("panel.dropOnBox"), false); return; }
    if (lendoSelecao) { dizer(t("panel.engineBusy"), false); return; }
    lendoSelecao = true;
    dizer(t("panel.dropReading", { n: mobs.length }), true);
    progresso({ fraction: 0, state: "waiting", elapsed_ms: 0, eta: true });

    function encerrar() {
      lendoSelecao = false;
      progresso(null);
    }

    comJob("/avid/mobs", { mob_ids: mobs }, [0, 1],
      function (res) {
        res = res || {};
        var arquivos = res.files || [];
        encerrar();
        if (!arquivos.length) { dizer(t("panel.dropNoFiles"), false); return; }
        if (res.mob_ids) mobIds = Object.assign(mobIds || {}, res.mob_ids);
        if (res.mob_names) mobNames = Object.assign(mobNames || {}, res.mob_names);
        if (res.mob_lengths) mobLengths = Object.assign(mobLengths || {}, res.mob_lengths);
        if (res.name && !$("seqNome").value) $("seqNome").value = res.name;
        nomeDoProjeto = res.name || nomeDoProjeto;
        // ⭐ Som solto = o clipe em que TODOS os arquivos são som, medido na essência pelo motor (`so_audio`): a mídia
        // gerenciada é toda `.mxf`, e um master com imagem e som é câmera.
        var sonoros = {}, porClipe = {}, ordem = [];
        (res.sound || []).forEach(function (c) { sonoros[c] = true; });
        arquivos.forEach(function (c) {
          var k = (mobIds && mobIds[c]) || c;
          if (!porClipe[k]) { porClipe[k] = []; ordem.push(k); }
          porClipe[k].push(c);
        });
        var video = [], audio = [];
        ordem.forEach(function (k) {
          var soSom = porClipe[k].every(function (c) { return sonoros[c]; });
          (soSom ? audio : video).push.apply(soSom ? audio : video, porClipe[k]);
        });
        entregar(alvo, video, audio, null, res.missing ? [t("panel.missing", { n: res.missing })] : []);
      },
      function (e) {
        encerrar();
        dizer(t("result.failed", { msg: e.message }), false);
      });
  }

  // ── a configuração da timeline ───────────────────────────────────────────────
  // Timeline, Taxa e Método são dropdowns. "Baseado na mídia" é a janela e o fps do PRIMEIRO arquivo de vídeo informado, e a
  // única opção que muda o valor da Taxa. ⛔ No Media Composer a timeline herda do projeto: fica cinza.
  var TAXAS = ["23.976", "24", "25", "29.97", "30", "50", "59.94", "60"];
  var CHAVE_TIMELINE = "sincronizar.timeline";

  function lembrarTimeline() {
    try {
      localStorage.setItem(CHAVE_TIMELINE, JSON.stringify({
        dim: $("tlDim").value, taxa: taxaEscolhida, w: $("tlW").value, h: $("tlH").value }));
    } catch (e) { /* preferência */ }
  }

  var taxaEscolhida = "23.976";

  function pintarTimeline() {
    var mc = modoNle === "mc", dim = $("tlDim").value, baseado = dim === "midia", taxa = $("tlTaxa");
    $("tlOutro").hidden = dim !== "outro";
    $("confTimeline").classList.toggle("inativo", mc);
    $("hintTimeline").hidden = !mc;
    $("tlDim").disabled = mc;
    $("tlW").disabled = mc;
    $("tlH").disabled = mc;
    taxa.disabled = mc || baseado;
    $("tlTaxaMidia").hidden = !baseado;
    if (baseado) { pintarMidiaNaTimeline(); }
    else { taxa.value = taxaEscolhida; }
  }

  function pintarMidiaNaTimeline() {
    if ($("tlDim").value !== "midia") return;
    var fps = fpsDeReferencia(), op = $("tlTaxaMidia");
    op.textContent = fps ? fpsEscrito(fps) : "—";
    $("tlTaxa").value = "midia";
  }

  // `null` = herdar (a primeira mídia, ou o projeto no MC); `false` = "Outro" com número inválido.
  function formatoDaTimeline() {
    var dim = $("tlDim").value;
    if (modoNle === "mc" || dim === "midia") return null;
    if (dim === "outro") {
      var w = parseInt($("tlW").value, 10), h = parseInt($("tlH").value, 10);
      if (!(w > 0) || !(h > 0)) return false;
      return { largura: w, altura: h, taxa: taxaEscolhida };
    }
    var m = dim.split("x");
    return { largura: Number(m[0]), altura: Number(m[1]), taxa: taxaEscolhida };
  }

  (function () {
    [["1920x1080", "1920×1080"], ["3840x2160", "3840×2160"], ["outro", t("panel.timelineOther")],
     ["midia", t("panel.timelineMedia")]].forEach(function (par) {
      var o = document.createElement("option");
      o.value = par[0];
      o.textContent = par[1];
      $("tlDim").appendChild(o);
    });
    TAXAS.forEach(function (v) {
      var o = document.createElement("option");
      o.value = v;
      o.textContent = v;
      $("tlTaxa").appendChild(o);
    });
    var daMidia = document.createElement("option");
    daMidia.value = "midia";
    daMidia.id = "tlTaxaMidia";
    daMidia.textContent = "—";
    daMidia.hidden = true;
    $("tlTaxa").appendChild(daMidia);
    var dim = "midia";
    try {
      var g = JSON.parse(localStorage.getItem(CHAVE_TIMELINE) || "null");
      if (g) {
        dim = g.dim || dim;
        taxaEscolhida = TAXAS.indexOf(g.taxa) >= 0 ? g.taxa : taxaEscolhida;
        $("tlW").value = g.w || "";
        $("tlH").value = g.h || "";
      }
    } catch (e) { /* preferência */ }
    $("tlDim").value = dim;
    $("tlDim").addEventListener("change", function () { pintarTimeline(); lembrarTimeline(); });
    $("tlTaxa").addEventListener("change", function () {
      if ($("tlTaxa").value !== "midia") taxaEscolhida = $("tlTaxa").value;
      lembrarTimeline();
    });
    $("tlW").addEventListener("change", lembrarTimeline);
    $("tlH").addEventListener("change", lembrarTimeline);
    $("btLimparFontes").addEventListener("click", function () {
      fontes = [];
      $("seqNome").value = "";
      dizer("", true);
      desenharFontes();
    });
  })();

  desenharFontes(); // nasce com a dica de arrastar os clipes da bin
  // ── a caixa de padrão ────────────────────────────────────────────────────────
  //
  // ⭐⭐ Portada do Assist anterior (`ui/preparar/padrao.js`), onde ela já serve DUAS
  // abas — Renomear e Subclipes. Aqui ela nasce servindo uma; a segunda chega na
  // etapa do subclipador, e vai usar esta mesma, não uma cópia. Duas caixas
  // divergiriam, e a que divergisse seria a que o editor usa para CONFERIR contra
  // a que o app usa para ESCREVER.
  //
  // ⚠️ Ela não conhece a gramática dos wildcards. Quem analisa o padrão é
  // `nomes/template.py`, no servidor; daqui só sai texto, e daqui só entram
  // `tokens` e `linhas` prontos.
  //
  // ⚠️ E a FRONTEIRA DE TEXTO NÃO CONFIÁVEL vale aqui: nome de coluna e valor de
  // exemplo vêm do projeto do editor. Nada entra por `innerHTML`; tudo por
  // `textContent`.
  function limpar(no) { while (no && no.firstChild) { no.removeChild(no.firstChild); } }

  function pedaco(pai, texto, classe) {
    if (!texto) { return; }
    var s = document.createElement("span");
    s.textContent = texto;
    if (classe) { s.className = classe; }
    pai.appendChild(s);
  }

  // ⭐⭐ A caixinha da tag fechada: `%{cena}` sai como uma pílula, com `%{` e `}`
  // apagados fazendo as bordas por dentro.
  //
  // ⚠️⚠️ Os delimitadores CONTINUAM sendo desenhados. É tentador escondê-los para
  // a caixa ficar limpa, mas o espelho está sobreposto ao input caractere a
  // caractere: sumir com três caracteres desalinharia o cursor do texto daí em
  // diante, e o editor digitaria numa posição e veria a letra em outra.
  function caixinha(pai, bruto) {
    var tag = document.createElement("span");
    tag.className = "tag";
    pedaco(tag, bruto.slice(0, 2), "delim");                 // `%{`
    pedaco(tag, bruto.slice(2, bruto.length - 1));           // o nome do campo
    pedaco(tag, bruto.slice(bruto.length - 1), "delim");     // `}`
    pai.appendChild(tag);
  }

  function ligarCaixaDePadrao(opcoes) {
    var inp = $(opcoes.input);
    if (!inp) { return null; }
    var estado = { tokens: [], sugestoes: [], marcada: -1, bloqueado: true };

    function espelhar() {
      var esp = $(opcoes.espelho);
      if (!esp) { return; }
      var texto = inp.value;
      limpar(esp);
      var i = 0;
      estado.tokens.forEach(function (t) {
        pedaco(esp, texto.slice(i, t.inicio));
        // O `bruto` inclui a cauda; o corpo é o que sobra sem ela.
        var cauda = t.cauda || "";
        var corpo = t.bruto.slice(0, t.bruto.length - cauda.length);
        // ⭐ A tag FECHADA (`%{cena}`) vira caixinha, como no Resolve. Ela se
        // reconhece pelo `bruto`: quem fechou, fechou no texto.
        if (t.campo !== null && corpo.charAt(1) === "{") {
          caixinha(esp, corpo);
          i = t.fim;
          return;
        }
        pedaco(esp, corpo, t.campo === null ? "ruim" : "campo");
        // A cauda que o motor devolveu ao literal (`_T` em `%shoot_T`) sai
        // marcada: é decisão DELE sobre o que o editor escreveu, e decisão
        // calada não passa.
        if (cauda) { pedaco(esp, cauda, "cauda"); }
        i = t.fim;
      });
      pedaco(esp, texto.slice(i));
      esp.scrollLeft = inp.scrollLeft;
    }

    var senha = 0, folga = null;
    function prever() {
      if (folga) { clearTimeout(folga); }
      folga = setTimeout(function () {
        var minha = ++senha;
        opcoes.prever(inp.value).then(function (r) {
          // ⚠️⚠️ Resposta ATRASADA não pinta por cima da nova: o debounce reduz
          // as idas, mas não as ordena, e a que voltasse por último venceria —
          // deixando na tela a prévia de um padrão que o editor já apagou.
          if (!r || minha !== senha) { return; }
          estado.tokens = r.tokens || [];
          estado.bloqueado = !!r.bloqueado;
          espelhar();
          if (opcoes.aoPrever) { opcoes.aoPrever(r); }
        }).catch(function () { /* a prévia é acabamento: falhar nela não fala */ });
      }, 150);
    }

    // ⚠️ Prefixo lido ATÉ O CURSOR: quem edita o meio de um padrão já escrito
    // precisa de sugestão para o token onde a mão está.
    //
    // ⭐ As DUAS formas pedem sugestão: `%ce` (aberta, de quem digita) e `%{ce`
    // (fechada pela metade, de quem começou a tag). Quem confirma sai sempre com
    // a fechada — ver `aceitar`.
    function tokenNoCursor() {
      var ate = inp.value.slice(0, inp.selectionStart);
      var m = /%(\{)?([A-Za-z_][A-Za-z0-9_]*)?$/.exec(ate);
      if (!m) { return null; }
      if (/%%$/.test(ate)) { return null; }   // `%%` é escape, não campo
      return { inicio: ate.length - m[0].length, prefixo: (m[2] || "").toLowerCase() };
    }

    function desenharSugestoes() {
      var caixa = $(opcoes.sugestoes);
      if (!caixa) { return; }
      limpar(caixa);
      // ⚠️ `tk`, e não `t`: neste arquivo `t` é a função de TRADUÇÃO, e uma
      // variável local com esse nome a sombreia dentro da função inteira. No
      // Assist anterior, de onde isto veio, o tradutor tem outro nome e a colisão
      // não existia — ela nasceu no porte, e derrubou a caixa com
      // "t is not a function" na primeira execução.
      var tk = tokenNoCursor();
      if (!tk) { caixa.hidden = true; estado.sugestoes = []; return; }
      var achados = (opcoes.catalogo() || []).filter(function (c) {
        return c.nome.indexOf(tk.prefixo) === 0;
      }).sort(function (a, b) {
        return a.nome.length - b.nome.length || (a.nome < b.nome ? -1 : 1);
      }).slice(0, 5);
      estado.sugestoes = achados;
      estado.marcada = achados.length ? 0 : -1;
      if (!achados.length) { caixa.hidden = true; return; }
      achados.forEach(function (c, i) {
        var bt = document.createElement("button");
        bt.type = "button";
        if (i === 0) { bt.className = "marcada"; }
        var n = document.createElement("span");
        n.className = "sug-nome"; n.textContent = "%" + c.nome;
        bt.appendChild(n);
        if (c.rotulo && c.rotulo !== c.nome) {
          var r = document.createElement("span");
          r.className = "sug-rotulo"; r.textContent = c.rotulo;
          bt.appendChild(r);
        }
        // ⚠️ O campo DERIVADO é marcado: o editor tem de saber se aquilo foi
        // lido da bin ou calculado por nós.
        if (c.procedencia === "derivado" || c.procedencia === "historico") {
          var d = document.createElement("span");
          d.className = c.procedencia === "historico" ? "sug-historico" : "sug-derivado";
          d.textContent = t(c.procedencia === "historico"
                            ? "rename.fromHistory" : "rename.derived");
          bt.appendChild(d);
        }
        if (c.exemplo) {
          var ex = document.createElement("span");
          ex.className = "sug-exemplo"; ex.textContent = c.exemplo;
          bt.appendChild(ex);
        }
        bt.addEventListener("mousedown", function (ev) {
          ev.preventDefault();       // não perder o foco antes de inserir
          aceitar(i);
        });
        caixa.appendChild(bt);
      });
      caixa.hidden = false;
    }

    function marcar(passo) {
      if (!estado.sugestoes.length) { return; }
      var n = estado.sugestoes.length;
      estado.marcada = ((estado.marcada + passo) % n + n) % n;
      var bts = $(opcoes.sugestoes).children;
      for (var i = 0; i < bts.length; i++) {
        bts[i].className = i === estado.marcada ? "marcada" : "";
      }
    }

    // ⭐⭐ CONFIRMAR FECHA A TAG — pedido do autor, 2026-09-06, e é o conserto de
    // `C%cenaP%plano`, que o motor lia como `%cenaP`:
    //
    // > *"podemos criar um sistema de fechar a tag quando o usuário confirmar.
    // > […] Se o usuário clicar nas tags sugeridas que ficam abaixo ela já entra
    // > como tag fechada de imediato"*
    //
    // ⚠️ Ele NÃO obriga ninguém a fechar: `%cena` digitado à mão continua
    // valendo, com o recuo de sempre. O que a confirmação garante é que o
    // caminho de MENOS esforço — clicar, ou dar Enter na sugestão — produza a
    // forma sem ambiguidade.
    function aceitar(indice) {
      var c = estado.sugestoes[indice === undefined ? estado.marcada : indice];
      var tk = tokenNoCursor();          // ⚠️ `tk` — ver o aviso em desenharSugestoes
      if (!c || !tk) { return; }
      var depois = inp.value.slice(inp.selectionStart);
      // ⚠️ Se a tag já estava fechada à frente do cursor (o editor voltou para
      // trocar o campo dentro de um `%{…}`), o `}` que existe não vira um
      // segundo `}`.
      depois = depois.replace(/^\}/, "");
      var tag = "%{" + c.nome + "}";
      inp.value = inp.value.slice(0, tk.inicio) + tag + depois;
      var pos = tk.inicio + tag.length;
      if (inp.setSelectionRange) { inp.setSelectionRange(pos, pos); }
      $(opcoes.sugestoes).hidden = true;
      estado.sugestoes = [];
      prever();
    }

    function inserir(texto) {
      var a = inp.selectionStart, b = inp.selectionEnd;
      inp.value = inp.value.slice(0, a) + texto + inp.value.slice(b);
      var pos = a + texto.length;
      if (inp.focus) { inp.focus(); }
      if (inp.setSelectionRange) { inp.setSelectionRange(pos, pos); }
      desenharSugestoes();
      prever();
    }

    // ⚠️ Um card só aparece se o campo EXISTIR neste material — um atalho que
    // insere campo inválido é uma armadilha com cara de ajuda.
    function desenharCards() {
      var caixa = $(opcoes.cards);
      if (!caixa) { return; }
      limpar(caixa);
      var tem = {};
      (opcoes.catalogo() || []).forEach(function (c) { tem[c.nome] = c; });
      (opcoes.cards_lista || []).forEach(function (nome) {
        if (!tem[nome]) { return; }
        var bt = document.createElement("button");
        bt.type = "button";
        // ⚠️ O card mostra o que ele INSERE, com as chaves. Mostrar `%cena` e
        // escrever `%{cena}` seria o botão dizendo uma coisa e fazendo outra —
        // e o editor aprenderia a sintaxe errada com a nossa ajuda.
        bt.textContent = "%{" + nome + "}";
        // ⭐ O campo que veio do NOSSO histórico se pinta diferente: o editor
        // tem de saber que aquele valor não está no material — se o histórico
        // sumir, ele some junto, o que nenhum campo medido faz.
        if (tem[nome].procedencia === "historico") { bt.className = "historico"; }
        bt.title = (tem[nome].rotulo || nome)
          + (tem[nome].exemplo ? " — " + tem[nome].exemplo : "");
        // ⭐ O card insere a tag FECHADA: clicar é confirmar, e é o gesto que
        // permite `C%{cena}P%{plano}` sem o editor saber que existe uma regra.
