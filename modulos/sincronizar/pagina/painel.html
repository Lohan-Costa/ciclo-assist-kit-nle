        bt.addEventListener("click", function () { inserir("%{" + nome + "}"); });
        caixa.appendChild(bt);
      });
    }

    inp.addEventListener("input", function () { desenharSugestoes(); prever(); });
    inp.addEventListener("click", desenharSugestoes);
    inp.addEventListener("scroll", function () {
      var esp = $(opcoes.espelho);
      if (esp) { esp.scrollLeft = inp.scrollLeft; }
    });
    inp.addEventListener("blur", function () {
      setTimeout(function () {
        var caixa = $(opcoes.sugestoes);
        if (caixa) { caixa.hidden = true; }
      }, 120);
    });
    inp.addEventListener("keydown", function (ev) {
      var caixa = $(opcoes.sugestoes);
      if (!caixa || caixa.hidden || !estado.sugestoes.length) { return; }
      if (ev.key === "ArrowDown") { ev.preventDefault(); marcar(1); }
      else if (ev.key === "ArrowUp") { ev.preventDefault(); marcar(-1); }
      else if (ev.key === "Enter" || ev.key === "Tab") { ev.preventDefault(); aceitar(); }
      else if (ev.key === "Escape") { caixa.hidden = true; }
    });

    return {
      valor: function () { return inp.value; },
      bloqueado: function () { return estado.bloqueado; },
      recarregar: function () { desenharCards(); prever(); },
      prever: prever
    };
  }

  // ── a aba RENOMEAR ───────────────────────────────────────────────────────────
  //
  // ⭐⭐ O preview NÃO é calculado aqui. Um parser de wildcard em JavaScript seria
  // uma segunda implementação da mesma gramática, e a que divergisse seria a do
  // PREVIEW contra a do APLICAR — o editor conferiria uma coisa e o motor
  // escreveria outra. O que este arquivo faz é PINTAR o que o servidor devolveu.
  var renameItens = [], renameCatalogo = [], renameId = null, caixaRenomear = null;

  //: Os atalhos que viram card, quando existem NESTE material.
  //:
  //: ⭐ `nome_original` vem PRIMEIRO e fica sempre à mão: é o caminho de volta,
  //: e ele precisa estar visível justamente quando algo saiu errado — não
  //: escondido atrás de digitar `%` e lembrar o nome do campo.
  var CARDS_RENOMEAR = ["nome_original", "name", "cena", "plano", "take", "take2",
                        "scene", "tapeid", "shoot_date"];

  function lerParaRenomear(mobs) {
    dizer(t("rename.reading", { n: mobs.length }), true);
    progresso({ fraction: 0, state: "waiting", elapsed_ms: 0, eta: true });

    comJob("/avid/renomear/ler",
      { mob_ids: mobs, todas_as_colunas: $("renameTodas").checked }, [0, 1],
      function (res) { nleDasLeituras = "mc"; receberRenomear(res); },
      function (e) {
        progresso(null);
        dizer(t("result.failed", { msg: e.message }), false);
      });
  }

  function receberRenomear(res) {
        progresso(null);
        res = res || {};
        renameItens = res.itens || [];
        renameCatalogo = res.catalogo || [];
        renameId = res.levantamento_id || null;
        if (!renameItens.length) { dizer(t("rename.nothing"), false); return; }

        $("renBlocoPadrao").hidden = false;
        $("renAcoes").hidden = false;
        // ⚠️ `ignorados` é o que veio de OUTRA bin — visível, nunca descartado
        // calado: o editor pode arrastar de duas bins sem perceber.
        var ign = (res.ignorados || []).length;
        dizer(ign ? t("rename.readWithIgnored", { n: renameItens.length, ign: ign })
                  : t("rename.read", { n: renameItens.length }), true);
        $("renameCampos").textContent =
          t("rename.fields", { n: renameItens.length, campos: renameCatalogo.length });

        if (!caixaRenomear) {
          caixaRenomear = ligarCaixaDePadrao({
            input: "renamePadrao", espelho: "renameEspelho",
            sugestoes: "renSugestoes", cards: "renCards",
            cards_lista: CARDS_RENOMEAR,
            catalogo: function () { return renameCatalogo; },
            prever: preverNoServidor,
            aoPrever: desenharLinhas
          });
        }
        // A lista aparece já com os nomes de AGORA, antes de qualquer padrão:
        // ver o material que entrou é o passo 1, e ele não depende do passo 2.
        desenharLinhas(null);
        if (caixaRenomear) { caixaRenomear.recarregar(); }
  }

  function preverNoServidor(padrao) {
    // ⚠️ Com o motor ocupado a rota responde 409 na hora (ela não entra na fila
    // do sidecar, que é serial). Devolver `null` é dizer "não sei agora", que é
    // diferente de "não muda nada".
    if (ocupado) { return Promise.resolve(null); }
    return fetch("/avid/nome/prever", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        padrao: padrao,
        fichas: renameItens.map(function (i) { return i.campos || {}; })
      })
    }).then(function (r) { return r.status === 409 ? null : r.json(); });
  }

  function desenharLinhas(previsto) {
    var corpo = $("renCorpo");
    if (!corpo) { return; }
    limpar(corpo);

    var linhas = previsto && !previsto.bloqueado ? previsto.linhas : null;
    var mudam = 0, vazios = 0, repetidos = 0, mantidos = 0;

    renameItens.forEach(function (item, i) {
      var l = linhas ? linhas[i] : null;
      var novo = l ? l.nome : item.nome;
      var muda = novo !== item.nome;
      if (muda) { mudam++; }
      if (l && l.vazios && l.vazios.length) { vazios++; }
      if (l && l.repetido) { repetidos++; }
      if (l && l.de_origem) { mantidos++; }

      var tr = document.createElement("tr");
      if (l && ((l.vazios && l.vazios.length) || l.repetido)) { tr.className = "ren-aviso"; }
      else if (!muda) { tr.className = "ren-igual"; }

      var tdItem = document.createElement("td");
      tdItem.textContent = item.nome || "";
      var tdVira = document.createElement("td");
      tdVira.className = "ren-vira";
      tdVira.textContent = novo;
      // O padrão sairia vazio: o item fica com o nome que tem (decisão do autor,
      // 2026-09-17), e a dica diz por que ele não mudou.
      if (l && l.de_origem) { tdVira.title = t("rename.keepsName"); }
      tr.appendChild(tdItem);
      tr.appendChild(tdVira);
      corpo.appendChild(tr);
    });

    var bt = $("btRenomear");
    if (previsto && previsto.bloqueado) {
      // ⚠️ Vermelho SÓ para o que bloqueia — senão a cor perde o significado
      // justamente quando ela precisa parar a mão do editor.
      $("renameResumo").className = "estado erro";
      $("renameResumo").textContent = (previsto.invalidos || []).length
        ? t("rename.unknownField", {
            what: previsto.invalidos.map(function (i) { return i.bruto; }).join(", ") })
        : t("rename.wouldBeEmpty");
      bt.disabled = true;
      return;
    }

    // ⭐ Contar o que MUDA, e não o que foi lido: aplicar sobre 50 clipes em que
    // 3 mudam é uma operação de 3 escritas, e é esse número que o editor precisa
    // reconhecer antes de clicar.
    var avisos = [];
    if (vazios) { avisos.push(t("rename.warnEmpty", { n: vazios })); }
    if (repetidos) { avisos.push(t("rename.warnRepeated", { n: repetidos })); }
    if (mantidos) { avisos.push(t("rename.warnKept", { n: mantidos })); }
    $("renameResumo").className = "estado";
    $("renameResumo").textContent = linhas
      ? t("rename.summary", { changed: mudam, total: renameItens.length })
        + (avisos.length ? " · " + avisos.join(" · ") : "")
      : "";
    // ⭐ O botão só abre com um padrão que passou E com algo a mudar. Um botão
    // vivo que não faria nada é uma promessa que a tela não cumpre.
    bt.disabled = ocupado || !linhas || mudam === 0;
  }

  // ── aplicar, e a volta ───────────────────────────────────────────────────────

  function aplicarRenomeacao() {
    if (!renameId || !caixaRenomear) { return; }
    var bt = $("btRenomear");
    bt.disabled = true;
    dizer(t("rename.applying"), true);
    progresso({ fraction: 0, state: "waiting", elapsed_ms: 0, eta: true });

    comJob("/avid/renomear/aplicar",
      // ⭐⭐ SÓ O PADRÃO viaja. O sidecar recompõe o plano com o mesmo `prever`
      // que desenhou esta tela — o conferido e o aplicado não podem divergir.
      { levantamento_id: renameId, padrao: caixaRenomear.valor() }, [0, 1],
      function (res) {
        progresso(null);
        mostrarResultado(res || {});
        carregarUltimoLote();
        // ⚠️ O levantamento agora está VELHO: os nomes na bin não são mais os
        // que a tabela mostra, e aplicar de novo por cima renomearia a partir de
        // um retrato desatualizado. Ler de novo é gesto do editor.
        renameId = null;
        bt.disabled = true;
      },
      function (e) {
        progresso(null);
        bt.disabled = false;
        dizer(t("result.failed", { msg: e.message }), false);
      });
  }

  function mostrarResultado(res) {
    var partes = [t("rename.applied", { n: res.aplicados || 0 })];
    if (res.inalterados) { partes.push(t("rename.unchanged", { n: res.inalterados })); }
    var falhas = res.falhas || [];
    if (falhas.length) { partes.push(t("rename.failed", { n: falhas.length })); }

    // ⚠️⚠️ `confirmado: false` NÃO é erro: o rename ACONTECEU na sessão do Media
    // Composer; o que não se conseguiu foi provar que chegou ao arquivo. A tela
    // tem de dizer isso **e o que fazer** — senão o editor fecha o projeto
    // achando que está gravado.
    var confirmado = res.confirmado !== false;
    if (!confirmado) { partes.push(t("rename.notConfirmed")); }
    dizer(partes.join(" · "), confirmado && !falhas.length);

    // As falhas POR ITEM entram na tabela no lugar do que se prometeu: sumir do
    // relatório seria pior que falhar, porque a bin fica em dois estados e essa
    // lista é o único jeito de o editor saber onde parou.
    if (falhas.length) {
      var corpo = $("renCorpo");
      limpar(corpo);
      falhas.forEach(function (f) {
        var tr = document.createElement("tr");
        tr.className = "ren-aviso";
        var de = document.createElement("td");
        de.textContent = f.nome_atual || f.mob_id || "";
        var erro = document.createElement("td");
        erro.className = "ren-vira";
        erro.textContent = f.erro || "";
        tr.appendChild(de);
        tr.appendChild(erro);
        corpo.appendChild(tr);
      });
    }
  }

  function carregarUltimoLote() {
    fetch("/avid/renomear/historico")
      .then(function (r) { return r.status === 409 ? null : r.json(); })
      .then(function (d) {
        if (!d) { return; }
        var lotes = (d.lotes || []).filter(function (l) { return !l.revertido; });
        var ultimo = lotes[0];
        $("renBlocoDesfazer").hidden = !ultimo;
        if (!ultimo) { return; }
        $("renUltimoLote").textContent = t("rename.lastBatch", {
          n: ultimo.aplicados, padrao: ultimo.padrao || "", quando: ultimo.quando || ""
        });
      })
      .catch(function () { /* o histórico é acabamento: falhar nele não fala */ });
  }

  function desfazer() {
    $("btDesfazer").disabled = true;
    dizer(t("rename.undoing"), true);
    progresso({ fraction: 0, state: "waiting", elapsed_ms: 0, eta: true });

    comJob("/avid/renomear/desfazer", {}, [0, 1],
      function (res) {
        progresso(null);
        res = res || {};
        $("btDesfazer").disabled = false;
        var partes = [t("rename.undone", { n: res.revertidos || 0 })];
        // ⛔ Os DIVERGENTES são o ponto: alguém renomeou à mão depois do lote, e
        // esses NÃO foram tocados. Desfazer por cima apagaria o trabalho de uma
        // pessoa para restaurar o de uma máquina — e a tela precisa dizer
        // quantos ficaram como estavam.
        var div = res.divergentes || [];
        if (div.length) { partes.push(t("rename.diverged", { n: div.length })); }
        if (res.confirmado === false) { partes.push(t("rename.notConfirmed")); }
        dizer(partes.join(" · "), !div.length && res.confirmado !== false);
        carregarUltimoLote();
      },
      function (e) {
        progresso(null);
        $("btDesfazer").disabled = false;
        dizer(t("result.failed", { msg: e.message }), false);
      });
  }

  $("btRenomear").addEventListener("click", function () {
    if (nleDasLeituras === "premiere") { aplicarRenomeacaoPremiere(); } else { aplicarRenomeacao(); }
  });
  $("btDesfazer").addEventListener("click", function () {
    if (modoNle === "premiere") { desfazerPremiere(); } else { desfazer(); }
  });

  // ── a aba SUBCLIPAR ──────────────────────────────────────────────────────────
  //
  // ⭐ O gesto é o mesmo do Assist anterior: arrastar a TIMELINE sincronizada. Daí
  // sai a `.avb` que a contém (uma chamada gRPC), e dela saem as tomadas.
  //
  // ⭐⭐ E a caixa de padrão é a MESMA da aba Renomear — `ligarCaixaDePadrao`,
  // instanciada duas vezes. Duas caixas divergiriam, e a que divergisse seria a
  // que o editor usa para conferir contra a que o app usa para escrever.
  var subTomadas = [], subCatalogo = [], subLeituraId = null;
  var subBin = null, caixaSubclipar = null;

  //: Os atalhos da aba, quando existem NESTE material.
  var CARDS_SUBCLIPAR = ["nome", "cena", "plano", "take", "take2", "scene",
                         "nomedoaudio", "nomedevideo", "tapeid"];

  function aoSoltarTimeline(mobs) {
    // ⚠️ UMA timeline por arrasto. Duas seriam ambíguas — qual bin, qual nome? —
    // e escolher a primeira em silêncio é a forma calada de errar.
    if (mobs.length > 1) { dizer(t("subclip.onePerDrop"), false); return; }

    dizer(t("subclip.finding"), true);
    progresso({ fraction: 0, state: "waiting", elapsed_ms: 0, eta: true });

    comJob("/avid/timeline", { mob_id: mobs[0] }, [0, 0.2],
      function (res) {
        res = res || {};
        subBin = res.bin || null;
        if (!subBin) { progresso(null); dizer(t("subclip.noBin"), false); return; }
        $("subBinEscolhida").hidden = false;
        $("subBinEscolhida").textContent = res.nome || "";
        lerTomadas(subBin);
      },
      function (e) {
        progresso(null);
        dizer(t("result.failed", { msg: e.message }), false);
      });
  }

  function lerTomadas(caminho) {
    dizer(t("subclip.reading"), true);
    comJob("/avid/subclipes/ler", { bin: caminho }, [0.2, 1],
      function (res) { nleDasLeituras = "mc"; receberTomadas(res); },
      function (e) {
        progresso(null);
        // ⚠️ A bin não salva e a forma desconhecida chegam como mensagem PRONTA
        // do sidecar — com o Ctrl+S dentro. Reescrevê-las aqui perderia o
        // conselho e deixaria "falhou".
        dizer(e.message || t("subclip.nothing"), false);
      });
  }

  function receberTomadas(res) {
        progresso(null);
        res = res || {};
        subTomadas = res.tomadas || [];
        subCatalogo = res.catalogo || [];
        subLeituraId = res.leitura_id || null;
        // ⚠️ Lista nova, estado de lista zerado: seleção, âncora, ordem e prévia
        // são todos POR ÍNDICE, e índice de outra lista aponta para outra tomada.
        subMarcados = {};
        subAncora = null;
        subPrevisto = null;
        subOrdem = { chave: null, desc: false };
        subVisivel = [];
        desenharCabecalhosDaLista();
        if (!subTomadas.length) { dizer(t("subclip.nothing"), false); return; }

        $("subBlocoTomadas").hidden = false;
        $("subBlocoPadrao").hidden = false;
        $("subAcoes").hidden = false;
        dizer(t("subclip.read", { n: subTomadas.length }), true);
        desenharTomadas();

        if (!caixaSubclipar) {
          caixaSubclipar = ligarCaixaDePadrao({
            input: "subPadrao", espelho: "subEspelho",
            sugestoes: "subSugestoes", cards: "subCards",
            cards_lista: CARDS_SUBCLIPAR,
            catalogo: function () { return subCatalogo; },
            prever: preverNomeDoSubclipe,
            aoPrever: aoPreverSubclipe
          });
        }
        caixaSubclipar.recarregar();
  }

  // ⭐⭐ O preview do Subclipar tem rota PRÓPRIA, e manda só o padrão.
  //
  // ⛔ Antes ele mandava `subFichas` — as fichas que vieram na leitura — e elas
  // ENVELHECIAM: marcar a cena à mão devolvia tomadas novas e fichas velhas, então
  // a tela desenhava `C25-1_T01` enquanto a bin recebia `C25_T02`. Só remover um
  // item corrigia, por acidente: aquela rota devolvia fichas.
  //
  // ⭐ Agora as tomadas ficam no sidecar e a resposta sai do MESMO `nomear.prever`
  // que a escrita usa. Não há o que envelhecer, e a lista inteira deixou de subir
  // a cada tecla digitada.
  function preverNomeDoSubclipe(padrao) {
    if (ocupado || !subLeituraId) { return Promise.resolve(null); }
    return fetch("/avid/subclipes/prever", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ padrao: padrao, leitura_id: subLeituraId })
    }).then(function (r) { return r.status === 409 ? null : r.json(); });
  }

  // ⭐⭐ AQUI O SUBCLIPAR DIVERGE DO RENOMEAR, e a divergência é do MOTOR, não da
  // tela: `avid/nomear.aplicar` faz o subclipe que não casa o padrão cair no nome
  // de origem (decisão do autor, 2026-09-05), e um padrão vazio cai no `%nome`.
  // Nenhum subclipe sai sem nome — logo, nada aqui "ficaria SEM NOME".
  //
  // ⚠️ A tela dizia o contrário: `prever` é compartilhado com o Renomear, onde
  // nome vazio bloqueia o lote inteiro com razão (lá se escreve por cima de
  // nomes que já existem). Herdar aquele bloqueio aqui punha um aviso vermelho
  // na tela do editor com o campo AINDA VAZIO — antes de ele digitar qualquer
  // coisa —, e desligava os dois botões por um problema que este caminho não
  // tem. Achado pelo autor usando, 2026-09-06:
  //
  // > *"A mensagem […] não precisa aparecer quando não houver nenhuma indicação
  // > no item 3 - o nome dos subclipes."*
  //
  // ⛔ Só o campo DESCONHECIDO bloqueia aqui — esse sim é engano de quem digitou,
  // e o motor recusa de qualquer jeito (`PadraoInvalido`).
  function aoPreverSubclipe(previsto) {
    var erro = $("subErro");
    var invalidos = (previsto && previsto.invalidos) || [];
    if (invalidos.length) {
      erro.className = "estado erro";
      erro.textContent = t("rename.unknownField", {
        what: invalidos.map(function (i) { return i.bruto; }).join(", ") });
    } else {
      erro.className = "estado";
      erro.textContent = "";
    }
    var bloqueado = invalidos.length > 0;
    $("btSubclipes").disabled = ocupado || bloqueado;
    $("btCenas").disabled = ocupado || bloqueado;
    desenharTomadas(previsto);
  }

  //: Os índices marcados na lista. ⚠️ Índice, e não o objeto: a lista é
  //: redesenhada a cada prévia, e guardar referência daria seleção fantasma.
  var subMarcados = {};

  //: ⭐ A ORDEM EM QUE A LISTA APARECE, como índices da `subTomadas`.
  //:
  //: ⚠️⚠️ `subTomadas` NUNCA é reordenada. O servidor conhece a lista pela posição
  //: — `/avid/subclipes/cena` e `/remover` recebem índices —, então embaralhar o
  //: array mandaria a cena para a tomada errada. Quem ordena é a TELA; a lista
  //: real fica onde está, e este vetor diz só em que ordem desenhá-la.
  var subVisivel = [];
  var subOrdem = { chave: null, desc: false };
  //: A âncora do shift: a última linha que o editor clicou sem shift.
  var subAncora = null;
  //: A última prévia recebida, para a ordenação por NOME ordenar pelo que está na
  //: tela — e não pelo nome cru, que a coluna não mostra.
  var subPrevisto = null;

  function marcadosAgora() {
    return Object.keys(subMarcados)
      .filter(function (k) { return subMarcados[k]; })
      .map(Number)
      .sort(function (a, b) { return a - b; });
  }

  function atualizarAcoesDaLista() {
    var n = marcadosAgora().length;
    $("btCena").disabled = ocupado || n === 0;
    $("subCena").disabled = ocupado || n === 0;
    $("btLimpar").disabled = ocupado || subTomadas.length === 0;
    $("btCena").textContent = n
      ? t("subclip.setSceneN", { n: n })
      : t("subclip.setScene");
  }

  //: O nome COMO ESTÁ NA TELA: o previsto pelo padrão, ou o de origem enquanto
  //: nenhuma prévia voltou.
  function nomeExibido(i) {
    var linhas = subPrevisto && subPrevisto.linhas;
    return linhas && linhas[i] ? linhas[i].nome : (subTomadas[i] || {}).nome || "";
  }

  //: As quatro colunas ordenáveis, na ordem do cabeçalho.
  var SUB_COLUNAS = [
    { id: "subColTake", i18n: "subclip.colName", chave: "nome" },
    { id: "subColCena", i18n: "subclip.colScene", chave: "cena" },
    { id: "subColDuracao", i18n: "subclip.colDuration", chave: "duracao" },
    { id: "subColVA", i18n: "subclip.colTracks", chave: "trilhas" }
  ];

  // ⚠️ `numeric: true` porque a régua aqui é humana: `25-10` vem DEPOIS de `25-9`
  // para quem monta, e a ordem alfabética crua diria o contrário. É a mesma
  // ordenação que o Explorer e o Finder fazem, que é a referência que o autor deu.
  function compararTomadas(chave, a, b) {
    var ta = subTomadas[a] || {}, tb = subTomadas[b] || {};
    if (chave === "duracao") { return (ta.duracao || 0) - (tb.duracao || 0); }
    if (chave === "trilhas") {
      var pa = ta.trilhas || {}, pb = tb.trilhas || {};
      return (pa.picture || 0) - (pb.picture || 0)
          || (pa.sound || 0) - (pb.sound || 0);
    }
    var va = String((chave === "cena" ? ta.cena : nomeExibido(a)) || "");
    var vb = String((chave === "cena" ? tb.cena : nomeExibido(b)) || "");
    return va.localeCompare(vb, undefined, { numeric: true, sensitivity: "base" });
  }

  // ⭐⭐ A ordenação é HIERÁRQUICA porque é ESTÁVEL, e o desempate é a posição
  // atual na tela. Ordenar por nome e depois por cena deixa as cenas em ordem
  // com os nomes ordenados dentro de cada uma — que é o que o editor espera de
  // uma lista de sistema operacional, e o que ele pediu por esse nome.
  function recalcularOrdem() {
    var natural = subTomadas.map(function (_t, i) { return i; });
    if (!subOrdem.chave) { subVisivel = natural; return; }
    var antes = subVisivel.length === subTomadas.length ? subVisivel : natural;
    var posicao = {};
    antes.forEach(function (idx, p) { posicao[idx] = p; });
    subVisivel = antes.slice().sort(function (a, b) {
      var c = compararTomadas(subOrdem.chave, a, b);
      if (subOrdem.desc) { c = -c; }
      return c || (posicao[a] - posicao[b]);
    });
  }

  function desenharCabecalhosDaLista() {
    SUB_COLUNAS.forEach(function (col) {
      var th = $(col.id);
      if (!th) { return; }
      th.textContent = t(col.i18n);
      var ativa = subOrdem.chave === col.chave;
      th.className = "ordena" + (ativa ? " ativa" : "");
      if (ativa) {
        // ⚠️ A seta é a única coisa que diz POR ONDE a lista está ordenada.
        // Sem ela, uma lista reordenada parece uma lista que mudou sozinha.
        pedaco(th, subOrdem.desc ? " ▼" : " ▲", "seta");
      }
    });
  }

  function ordenarPor(chave) {
    if (!subTomadas.length) { return; }
    // Clicar de novo na mesma coluna inverte — como no Explorer e no Finder.
    subOrdem = subOrdem.chave === chave
      ? { chave: chave, desc: !subOrdem.desc }
      : { chave: chave, desc: false };
    recalcularOrdem();
    desenharCabecalhosDaLista();
    desenharTomadas();
  }

  // ── a seleção, como no Explorer e no Finder ────────────────────────────────
  //
  // ⭐⭐ Pedido do autor, 2026-09-06:
  //
  // > *"o ideal é ter a possibilidade de seleção de itens como é no
  // > explorer/finder que podemos combinar teclas cmd/ctrl e/ou shift"*
  //
  // ⚠️ O INTERVALO do shift é sobre a ordem VISÍVEL, não sobre a lista real:
  // quem clica na primeira linha e faz shift na quinta quer as cinco que ele
  // está vendo. Com a lista ordenada por cena, os índices reais entre elas são
  // outros — e pegá-los daria uma seleção que a tela não explica.
  function clicarNaLinha(idx, ev) {
    var ctrl = !!(ev && (ev.ctrlKey || ev.metaKey));
    var shift = !!(ev && ev.shiftKey);
    if (shift && subAncora !== null) {
      var a = subVisivel.indexOf(subAncora), b = subVisivel.indexOf(idx);
      if (a < 0) { a = b; }
      // ⚠️ Sem ctrl, o intervalo SUBSTITUI a seleção — é o que o Explorer faz, e
      // somar sempre deixaria o editor sem jeito de recomeçar sem recarregar.
      if (!ctrl) { subMarcados = {}; }
      for (var p = Math.min(a, b); p <= Math.max(a, b); p++) {
        subMarcados[subVisivel[p]] = true;
      }
    } else if (ctrl) {
      subMarcados[idx] = !subMarcados[idx];
      subAncora = idx;
    } else {
      subMarcados = {};
      subMarcados[idx] = true;
      subAncora = idx;
    }
    desenharTomadas();
  }

  function selecionarTudoNaLista() {
    subMarcados = {};
    subTomadas.forEach(function (_t, i) { subMarcados[i] = true; });
    desenharTomadas();
  }

  function desenharTomadas(previsto) {
    var corpo = $("subCorpo");
    if (!corpo) { return; }
    limpar(corpo);
    if (previsto !== undefined) { subPrevisto = previsto; }
    if (subVisivel.length !== subTomadas.length) { recalcularOrdem(); }

    var linhas = subPrevisto && !subPrevisto.bloqueado ? subPrevisto.linhas : null;
    var aparadas = 0, semCena = 0, deOrigem = 0;

    subVisivel.forEach(function (i) {
      var tk = subTomadas[i];
      if (!tk) { return; }
      var tr = document.createElement("tr");
      // ⚠️ Duas marcas DIFERENTES, e a distinção é do material: sem claquete
      // legível o editor lê o nome e aponta a cena; um órfão teve a cena
      // PRESUMIDA pela posição na timeline e precisa de revisão humana.
      var classes = [];
      if (!tk.resolvido) { classes.push("nao-resolvido"); }
      else if (tk.orfao) { classes.push("orfao"); }
      if (subMarcados[i]) { classes.push("marcada"); }
      tr.className = classes.join(" ");

      var cel = function (texto, classe) {
        var td = document.createElement("td");
        td.textContent = texto;
        if (classe) { td.className = classe; }
        tr.appendChild(td);
        return td;
      };

      // ⭐ A LINHA INTEIRA é o alvo do clique. Ver `clicarNaLinha`.
      tr.addEventListener("click", function (ev) { clicarNaLinha(i, ev); });

      // ⭐ O nome que a bin VAI receber — e a marca de quem não casou o padrão.
      //
      // ⚠️ Sem a marca, esse take aparece com um nome de outra forma no meio da
      // lista e vira mistério: o editor não tem como saber que ali o padrão não
      // se aplicou e o Órbita usou o nome de origem. É a mesma regra de sempre —
      // decisão nossa que não se declara passa por dado do material.
      var linha = linhas && linhas[i] ? linhas[i] : null;
      var tdNome = cel(linha ? linha.nome : tk.nome);
      if (linha && linha.de_origem) {
        tdNome.className = "nome-origem";
        tdNome.title = t("subclip.fromSource");
        deOrigem++;
      }

      // ⭐ A procedência da cena aparece: "presumida" veio da POSIÇÃO do órfão na
      // timeline — inferência que não se declara passa por medição.
      //
      // ⚠️ A posta À MÃO se declara só pela COR, sem sufixo. Decisão do autor,
      // 2026-09-06: *"não precisamos desse sufixo 'à mão', basta a cor azul como
      // indicador de alteração"*. A diferença para a presumida é de natureza: a
      // presumida é um palpite NOSSO, que ele precisa revisar; a posta à mão é
      // dele, e repetir "à mão" para quem acabou de digitar rouba a largura de
      // uma tela estreita para dizer o que ele já sabe.
      var tdCena = cel(
        tk.cena
          ? (tk.convencao === "posicao" || tk.convencao === "forma_da_diaria"
               ? t("subclip.scenePresumed", { cena: (tk.episodio ? tk.episodio + " " : "") + tk.cena })
               : (tk.episodio ? tk.episodio + " " : "") + tk.cena)
          : t("subclip.noScene"));
      if (tk.convencao === "manual") { tdCena.className = "cena-manual"; }
      if (!tk.cena) { semCena++; }

      // ⚠️ O APARO aparece com o número: um take que perdeu 88 s de cauda
      // porque a câmera parou cedo continua legítimo, mas o editor precisa ver
      // isso ANTES de abrir a bin — senão descobre o corte olhando o material.
      // ⛔ A taxa vem do MATERIAL (`edit_rate`, que o sidecar manda em cada tomada),
      //    e não fixa em 24: a 29,97 a conta fixa mostrava 25% a MAIS — um take de
      //    60 s aparecia como 75 s, e esta coluna existe justamente para o editor
      //    decidir SEM abrir a bin. (Achado e consertado no Assist anterior em
      //    2026-09-19; volta para casa em 2026-09-21.)
      // ⚠️ Sem taxa não se inventa segundo: mostra QUADROS, que é o dado que se tem.
      var seg = function (frames) {
        return tk.edit_rate ? (frames / tk.edit_rate).toFixed(1) + "s"
                            : frames + "q";
      };
      cel(tk.aparado
            ? seg(tk.duracao) + " (−" + seg(tk.aparado) + ")"
            : seg(tk.duracao));
      if (tk.aparado) { aparadas++; }

      cel("V" + tk.trilhas.picture + " A" + tk.trilhas.sound);

      // ── o X, à direita ──
      var tdX = document.createElement("td");
      tdX.className = "col-x";
      var x = document.createElement("button");
      x.type = "button";
      x.textContent = "✕";
      x.title = t("subclip.removeOne");
      x.addEventListener("click", function (ev) {
        // ⚠️ O X está DENTRO da linha, que agora seleciona ao clique. Sem parar
        // a propagação, tirar um item da lista também mudaria a seleção — e o
        // editor veria a lista encolher e a seleção pular, sem ter pedido.
        if (ev && ev.stopPropagation) { ev.stopPropagation(); }
        remover([i]);
      });
      tdX.appendChild(x);
      tr.appendChild(tdX);

      corpo.appendChild(tr);
    });

    var partes = [t("subclip.summary", { n: subTomadas.length })];
    if (aparadas) { partes.push(t("subclip.trimmed", { n: aparadas })); }
    if (semCena) { partes.push(t("subclip.withoutScene", { n: semCena })); }
    // ⚠️ Contado no RESUMO, e não só marcado na linha: numa diária de 50 a marca
    // some na rolagem, e o editor precisa saber ANTES de gerar que o padrão dele
    // não pegou em N tomadas.
    if (deOrigem) { partes.push(t("subclip.fromSourceN", { n: deOrigem })); }
    $("subResumo").textContent = partes.join(" · ");
    atualizarAcoesDaLista();
  }

  // ── as três ações da lista ───────────────────────────────────────────────────

  function aplicarNaLista(rota, corpo, aoVoltar) {
    return fetch(rota, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo)
    }).then(function (r) {
      if (r.status === 409) { dizer(t("panel.busy"), false); return null; }
      return r.json();
    }).then(function (d) {
      if (!d) { return; }
      if (d.error) { dizer(d.error, false); return; }
      aoVoltar(d);
    }).catch(function (e) {
      dizer(t("result.failed", { msg: e.message }), false);
    });
  }

  function marcarCena() {
    var alvos = marcadosAgora();
    if (!alvos.length || !subLeituraId) { return; }
    var cena = $("subCena").value.trim();

    aplicarNaLista("/avid/subclipes/cena",
      { leitura_id: subLeituraId, indices: alvos, cena: cena },
      function (d) {
        subTomadas = d.tomadas || subTomadas;
        // ⚠️ A seleção SOBREVIVE: o editor costuma corrigir a cena e conferir o
        // que marcou. Limpar aqui o obrigaria a remarcar para ver o resultado.
        dizer(t("subclip.sceneSet", { n: d.alteradas || 0 }), true);
        // ⚠️ Desenha NA HORA e pede a prévia depois: o `prever` tem debounce, e
        // esperar por ele deixaria a tabela um passo atrás do que o editor
        // acabou de fazer — clicou, e nada mudou.
        //
        // ⚠️ Sem argumento, e não `null`: a lista tem o MESMO tamanho, então a
        // prévia anterior ainda casa linha a linha. Jogá-la fora faria a coluna
        // do nome piscar para o nome cru e voltar 150 ms depois.
        desenharTomadas();
        if (caixaSubclipar) { caixaSubclipar.prever(); }
      });
  }

  function remover(indices, tudo) {
    if (!subLeituraId) { return; }
    var corpo = { leitura_id: subLeituraId };
    if (tudo) { corpo.tudo = true; } else { corpo.indices = indices; }

    aplicarNaLista("/avid/subclipes/remover", corpo, function (d) {
      subTomadas = d.tomadas || [];
      // ⚠️ A seleção é POR ÍNDICE, e os índices mudaram: mantê-la marcaria
      // linhas que ninguém escolheu. Some junto com o que foi removido.
      //
      // ⚠️⚠️ E a PRÉVIA cai junto, pela mesma razão e com consequência pior: as
      // linhas dela também são por posição, e reaproveitá-las depois de a lista
      // encolher mostraria o nome de um subclipe em cima de outro.
      subMarcados = {};
      subAncora = null;
      subPrevisto = null;
      subVisivel = [];
      recalcularOrdem();
      if (!subTomadas.length) {
        // Lista vazia = a aba volta ao começo, e o arrasto é o caminho de volta.
        $("subBlocoTomadas").hidden = true;
        $("subBlocoPadrao").hidden = true;
        $("subAcoes").hidden = true;
        $("subBinEscolhida").hidden = true;
        subLeituraId = null;
        dizer(t("subclip.cleared"), true);
        return;
      }
      desenharTomadas();
      if (caixaSubclipar) { caixaSubclipar.prever(); }
    });
  }

  SUB_COLUNAS.forEach(function (col) {
    var th = $(col.id);
    if (th) { th.addEventListener("click", function () { ordenarPor(col.chave); }); }
  });

  // ⭐⭐ O TECLADO da lista — Delete tira, Ctrl/Cmd+A pega tudo. Pedido do autor:
  // *"selecionou um clipe e apertou delete no teclado: remove o clipe ou os
  // clipes da lista"*.
  //
  // ⚠️⚠️ O ouvinte é do DOCUMENTO, e por isso precisa se recusar TRÊS vezes:
  //
  //  1. num campo de texto (a cena, o padrão), Delete apaga LETRA e Ctrl+A
  //     seleciona o TEXTO — roubar essas teclas ali quebraria a digitação para
  //     servir a lista;
  //  2. fora da aba Subclipar a lista não está na tela. ⛔ E `subBlocoTomadas`
  //     NÃO responde isso: quem esconde a aba é a classe da `<section>`, não o
  //     `hidden` do bloco — que continua ligado enquanto houver tomadas lidas.
  //     Sem esta linha, apertar Delete na aba Renomear apagaria clipes de uma
  //     lista que o editor nem está vendo;
  //  3. e sem lista não há o que apagar.
  document.addEventListener("keydown", function (ev) {
    if (!ev || ocupado) { return; }
    var alvo = ev.target || {};
    if (alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA") { return; }
    if (abaAtual !== "subclip") { return; }
    if ($("subBlocoTomadas").hidden || !subTomadas.length) { return; }
    if (ev.key === "Delete" || ev.key === "Backspace") {
      var alvos = marcadosAgora();
      if (!alvos.length) { return; }
      if (ev.preventDefault) { ev.preventDefault(); }
      remover(alvos);
    } else if ((ev.ctrlKey || ev.metaKey) && (ev.key === "a" || ev.key === "A")) {
      if (ev.preventDefault) { ev.preventDefault(); }
      selecionarTudoNaLista();
    }
  });

  $("btCena").addEventListener("click", marcarCena);
  $("subCena").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { marcarCena(); }
  });
  $("btLimpar").addEventListener("click", function () { remover([], true); });

  function gerar(porCena) {
    if (!subLeituraId || !caixaSubclipar) { return; }
    $("btSubclipes").disabled = true;
    $("btCenas").disabled = true;
    dizer(t("subclip.writing"), true);
    progresso({ fraction: 0, state: "waiting", elapsed_ms: 0, eta: true });

    comJob("/avid/subclipes/gerar",
      { leitura_id: subLeituraId, padrao: caixaSubclipar.valor(), por_cena: !!porCena },
      [0, 1],
      function (res) {
        progresso(null);
        res = res || {};
        $("btSubclipes").disabled = false;
        $("btCenas").disabled = false;
        var partes = [];
        if (porCena) {
          partes.push(t("subclip.doneScenes", { n: (res.bins || []).length,
                                                total: res.total || 0 }));
        } else {
          partes.push(t("subclip.done", { n: res.subclipes || 0 }));
          if (res.com_filler) {
            partes.push(t("subclip.withFiller", { n: res.com_filler }));
          }
        }
        // ⚠️ Escrever e ABRIR são coisas diferentes: as bins estão no disco de
        // qualquer jeito, e dizer o contrário mandaria o editor procurar o que
        // não se perdeu.
        if (res.aberta === false) { partes.push(t("subclip.notOpened")); }
        dizer(partes.join(" · "), true);
      },
      function (e) {
        progresso(null);
        $("btSubclipes").disabled = false;
        $("btCenas").disabled = false;
        dizer(e.message || t("result.failed", { msg: "" }), false);
      });
  }

  $("btSubclipes").addEventListener("click", function () {
    if (nleDasLeituras === "premiere") { gerarMergedPremiere(); } else { gerar(false); }
  });
  $("btCenas").addEventListener("click", function () { gerar(true); });


  // ══════════════════════════════════════════════════════════════════════════
  //  A JANELA DO APP — o Órbita Painel (organograma de 2026-10-21)
  // ══════════════════════════════════════════════════════════════════════════
  //
  // A MESMA página do painel do Avid, aberta pelo app em `?casca=app`. Ela segue o
  // NLE conectado (`/conexao`): o Premiere pela ponte invisível, o Media Composer pelo
  // motor (o caminho de sempre deste painel). Nesta etapa só Sincronizar e ⚙.
  var modoNle = null;          // "premiere" | "mc" | null
  var estadoPremiere = "";     // "versao\tcaminho do projeto"
  var montando = false;        // a ponte está ocupada montando: a batida não pergunta nada
  var versaoDoApp = "";

  // Uma função do `host.jsx` no Premiere. O servidor só ENFILEIRA (ele atende uma
  // requisição por vez e não pode esperar o Premiere); o resultado vem por pergunta.
  function premiere(funcao, args, prazoMs) {
    return fetch("/premiere/chamar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ funcao: funcao, args: args || [] })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.id) throw new Error(res.j.error || "HTTP");
        var limite = Date.now() + (prazoMs || 30000);
        return new Promise(function (ok, falha) {
          function perguntar() {
            fetch("/premiere/resultado?id=" + res.j.id, { cache: "no-store" })
              .then(function (r) { return r.json(); })
              .then(function (st) {
                if (st.pronto) {
                  var r = String(st.r == null ? "" : st.r);
                  if (r.indexOf("EvalScript error") === 0) {
                    falha(new Error(funcao + " falhou dentro do Premiere (" + r + ")"));
                  } else { ok(r); }
                  return;
                }
                if (st.error) { falha(new Error(st.error)); return; }
                if (Date.now() > limite) {
                  falha(new Error("o Premiere não respondeu a tempo (diálogo aberto?)"));
                  return;
                }
                setTimeout(perguntar, 80);
              })
              .catch(falha);
          }
          perguntar();
        });
      });
  }

  function nomeDoArquivoDeProjeto(caminho) {
    var n = String(caminho || "").split(/[\\/]/).pop();
    return n.replace(/\.prproj$/i, "");
  }

  function pintarConexao() {
    var texto, classe;
    if (modoNle === "premiere") {
      var partes = estadoPremiere.split("\t");
      var v = (partes[0] || "").split(".").slice(0, 2).join(".");
      texto = t("app.premiere", { v: v }) + (partes[1] ? " · " + nomeDoArquivoDeProjeto(partes[1]) : "");
      classe = "up";
    } else if (modoNle === "mc") {
      texto = t("app.mc");
      classe = "up";
    } else {
      texto = t("app.noProgram");
      classe = "wait";
    }
    elStatus.className = classe;
    elStatusText.textContent = texto;
    $("rodapeNle").textContent = "Sincronizar " + versaoDoApp;
  }

  // ══ SUBCLIPAR e RENOMEAR no PREMIERE (2026-11-07, plano um app só — a Preparar no Premiere) ═════════════════
  // As telas são as do Media Composer; o que muda são as pontas que falam com o editor. A leitura do Premiere sai do
  // host.jsx (`sincGetSequenceForMerged`, `sincRenameScan`) e vai às rotas `/premiere/merged/ler` e
  // `/premiere/renomear/ler`; a prévia, a cena e o remover são as MESMAS rotas do MC (operam na leitura guardada).
  // Porte das abas do painel CEP do Órbita (`premiere-cep/js/merged.js`, `rename.js`, histórico do repo).
  var nleDasLeituras = null;   // o NLE de onde veio a leitura na tela — trocou, a tela zera

  function textosDoNle() {
    var pr = modoNle === "premiere";
    $("tabSubclip").textContent = pr ? t("subclip.prTab") : t("panel.tabSubclip");
    $("subclipVazio").textContent = pr ? t("subclip.prEmpty") : t("subclip.emptyState");
    $("btSubclipes").textContent = pr ? t("subclip.prGenerate") : t("subclip.oneBin");
    $("btCenas").style.display = pr ? "none" : "";
    $("btLerSequenciaPr").hidden = false;
    $("btLerSequenciaPr").style.display = pr ? "" : "none";  // `hidden` perde para o `button.act` do CSS
    $("renameDica").textContent = pr ? t("rename.prHint") : t("rename.dropHere");
    $("btLerSelecaoPr").hidden = false;
    $("btLerSelecaoPr").style.display = pr ? "" : "none";
    var todas = $("renameTodas");
    if (todas && todas.parentNode) { todas.parentNode.style.display = pr ? "none" : ""; }
    if (nleDasLeituras && nleDasLeituras !== modoNle) { zerarLeituras(); }
  }

  function zerarLeituras() {
    nleDasLeituras = null;
    subLeituraId = null; subTomadas = []; renameId = null; renameItens = [];
    ["subBlocoTomadas", "subBlocoPadrao", "subAcoes", "subBinEscolhida", "renBlocoPadrao", "renAcoes"]
      .forEach(function (id) { $(id).hidden = true; });
    limpar($("renCorpo"));
  }

  function postJson(rota, corpo) {
    return fetch(rota, { method: "POST", headers: { "Content-Type": "application/json" },
                         body: JSON.stringify(corpo || {}) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.j && res.j.busy) throw new Error(t("panel.engineBusy"));
        if (!res.ok || (res.j && res.j.error)) throw new Error((res.j && res.j.error) || "HTTP");
        return res.j;
      });
  }

  function linhasComAbas(raw) {
    return String(raw || "").split("\n").filter(Boolean).map(function (l) { return l.split("\t"); });
  }

  /** O formato do .prproj pela versão do Premiere aberto: < 25 → o do 2023. */
  function alvoDaVersao(v) {
    var maior = parseInt(String(v || "").split(".")[0], 10);
    return !isNaN(maior) && maior < 25 ? "2023" : "25";
  }

  var subNomeDaSequencia = "";

  // `nodeId` vazio = a sequência ATIVA; com nodeId = a sequência arrastada da bin.
  function lerMergedPremiere(nodeId) {
    if (modoNle !== "premiere") { dizer(t("app.premiereOffline"), false); return; }
    dizer(t("subclip.reading"), true);
    premiere("sincGetSequenceForMerged", [nodeId || ""], 60000).then(function (raw) {
      raw = String(raw || "");
      if (raw.indexOf("err|") === 0) {
        throw new Error(raw.slice(4) === "nosequence" ? t("subclip.prNoSequence") : raw.slice(4));
      }
      var fps = 0, nome = "";
      linhasComAbas(raw).forEach(function (c) {
        if (c[0] === "fps") fps = Number(c[1]);
        if (c[0] === "nome") nome = c.slice(1).join(" ");
      });
      return postJson("/premiere/merged/ler", { registros: raw, fps: fps, so_selecionados: false, projeto: projetoAtual() })
        .then(function (j) { return { nome: nome, j: j }; });
    }).then(function (x) {
      subNomeDaSequencia = x.nome || "";
      $("subBinEscolhida").hidden = !subNomeDaSequencia;
      $("subBinEscolhida").textContent = subNomeDaSequencia;
      nleDasLeituras = "premiere";
      receberTomadas(x.j);
    }).catch(function (e) { dizer(t("result.failed", { msg: (e && e.message) || String(e) }), false); });
  }

  function gerarMergedPremiere() {
    if (!subLeituraId || !caixaSubclipar) { return; }
    $("btSubclipes").disabled = true;
    var nomeBin = (subNomeDaSequencia || "SEQUENCIA") + " MERGED";
    var alvo = "25";
    dizer(t("subclip.writing"), true);
    progresso({ fraction: 0, state: "waiting", elapsed_ms: 0, eta: true });
    premiere("sincAppVersion", [], 15000).then(function (v) {
      alvo = alvoDaVersao(v);
      return new Promise(function (ok, falha) {
        comJob("/premiere/merged/gerar", { leitura_id: subLeituraId, padrao: caixaSubclipar.valor(), bin: nomeBin,
                                           premiere_alvo: alvo }, [0, 0.8], ok, falha);
      });
    }).then(function (res) {
      res = res || {};
      dizer(t("subclip.prImporting"), true);
      var aparos = (res.aparos || []).map(function (a) {
        return a.chega_como + "\t" + a.nome + "\t" + a.in + "\t" + a.out;
      }).join("\n");
      // ⭐ Sem merged nenhum (todos soltos) não há `.prproj` a importar.
      var importar = res.arquivo ? premiere("sincImportMerged", [res.arquivo, aparos], 180000) : Promise.resolve("");
      return importar.then(function (txt) {
        // Os clipes sem som direto saem como subclipe, na mesma bin (o órfão do Avid também é subclipe).
        var soltos = (res.soltos || []).map(function (a) {
          return a.caminho + "\t" + a.nome + "\t" + a.in + "\t" + a.out;
        }).join("\n");
        if (!soltos) return { res: res, txt: txt, soltos: "" };
        return premiere("sincCriarSoltos", [nomeBin, soltos], 180000).then(function (s) {
          return { res: res, txt: txt, soltos: s };
        });
      });
    }).then(function (x) {
      progresso(null);
      var r = {};
      linhasComAbas(x.txt).forEach(function (c) { r[c[0]] = c.slice(1).join("\t"); });
      if (r.erro) throw new Error(r.erro);
      var merged = Number(r.merged || 0);
      var s = {};
      linhasComAbas(x.soltos).forEach(function (c) { s[c[0]] = c.slice(1).join("\t"); });
      if (s.erro) throw new Error(s.erro);
      var soltos = Number(s.criados || 0);
      var partes = [merged || soltos ? t("subclip.prDone", { n: merged, bin: nomeBin }) : t("subclip.prNothing")];
      if (soltos) partes.push(t("subclip.prLoose", { n: soltos }));
      if (s.falhas) partes.push(t("subclip.prLooseFailed", { nomes: s.falhas }));
      var ign = x.res.ignoradas || [];
      if (ign.length) partes.push(t("subclip.prSkipped", { n: ign.length, nomes: ign.join(", ") }));
      if (r.falhas) partes.push(t("subclip.prTrimFailed", { nomes: r.falhas }));
      dizer(partes.join(" · "), (merged > 0 || soltos > 0) && !r.falhas && !s.falhas);
    }).catch(function (e) {
      progresso(null);
      dizer(t("result.failed", { msg: (e && e.message) || String(e) }), false);
    }).then(function () { $("btSubclipes").disabled = false; });
  }

  function lerParaRenomearPremiere() {
    if (modoNle !== "premiere") { dizer(t("app.premiereOffline"), false); return; }
    dizer(t("app.readingSelection"), true);
    premiere("sincRenameScan", [], 60000).then(function (raw) {
      raw = String(raw || "");
      if (raw.indexOf("err|") === 0) throw new Error(raw.slice(4));
      var projeto = "", enviados = [];
      linhasComAbas(raw).forEach(function (c) {
        if (c[0] === "projeto") { projeto = c.slice(1).join("\t"); return; }
        if (c.length < 7) return;
        enviados.push({ node_id: c[0], tipo: c[1], nome: c[2], colunas_json: c[3],
                        xmp: { scene: c[4], take: c[5], bext: c[6] } });
      });
      if (!enviados.length) throw new Error(t("rename.nothing"));
      return postJson("/premiere/renomear/ler", { projeto: projeto, itens: enviados });
    }).then(function (j) {
      nleDasLeituras = "premiere";
      receberRenomear({ itens: j.itens, catalogo: j.catalogo, levantamento_id: j.levantamento_id });
      $("renBlocoDesfazer").hidden = false;
      $("renUltimoLote").textContent = t("rename.prUndoInfo");
    }).catch(function (e) { dizer(t("result.failed", { msg: (e && e.message) || String(e) }), false); });
  }

  // O host escreve cada nome SÓ se o de agora for o esperado — quem renomeou por cima não perde o trabalho.
  function escreverNomesNoPremiere(plano) {
    var texto = (plano || []).map(function (p) {
      return p.node_id + "\t" + p.nome_atual + "\t" + p.nome_novo;
    }).join("\n");
    return premiere("sincRenameApply", [texto], 120000).then(function (raw) {
      raw = String(raw || "");
      if (raw.indexOf("erro\t") === 0) throw new Error(raw.slice(5));
      var r = { ok: 0, igual: 0, diverge: [], ausente: 0, falhas: [] };
      linhasComAbas(raw).forEach(function (c) {
        if (c[0] === "ok") r.ok++;
        else if (c[0] === "igual") r.igual++;
        else if (c[0] === "diverge") r.diverge.push(c[2] || c[1]);
        else if (c[0] === "ausente") r.ausente++;
        else if (c[0] === "falha") r.falhas.push({ node_id: c[1], erro: c[2] || "" });
      });
      return r;
    });
  }

  function aplicarRenomeacaoPremiere() {
    if (!renameId || !caixaRenomear) { return; }
    var bt = $("btRenomear"), undo = "";
    bt.disabled = true;
    dizer(t("rename.applying"), true);
    premiere("sincAppVersion", [], 15000).then(function (versao) {
      return postJson("/premiere/renomear/plano", {
        levantamento_id: renameId, padrao: caixaRenomear.valor(),
        indices: renameItens.map(function (_, i) { return i; }), versao: versao });
    }).then(function (j) {
      undo = j.undo_id;
      return escreverNomesNoPremiere(j.plano);
    }).then(function (r) {
      postJson("/premiere/renomear/fim", { undo_id: undo, aplicados: r.ok, falhas: r.falhas }).catch(function () {});
      mostrarResultado({ aplicados: r.ok, inalterados: r.igual,
                         falhas: r.falhas.map(function (f) { return { nome_atual: f.node_id, erro: f.erro }; }) });
      var extra = [];
      if (r.diverge.length) extra.push(t("rename.prDiverged", { n: r.diverge.length }));
      if (r.ok) extra.push(t("rename.prSaveHint"));
      if (extra.length) dizer($("msg").textContent + " · " + extra.join(" · "), !r.diverge.length && !r.falhas.length);
      renameId = null;
    }).catch(function (e) {
      bt.disabled = false;
      dizer(t("result.failed", { msg: (e && e.message) || String(e) }), false);
    });
  }

  function desfazerPremiere() {
    $("btDesfazer").disabled = true;
    dizer(t("rename.undoing"), true);
    var undo = "";
    premiere("sincProjectPath", [], 15000).then(function (proj) {
      return postJson("/premiere/renomear/desfazer", { projeto: String(proj || "") });
    }).then(function (j) {
      undo = j.undo_id;
      return escreverNomesNoPremiere(j.plano);
    }).then(function (r) {
      postJson("/premiere/renomear/fim", { undo_id: undo, aplicados: r.ok, falhas: r.falhas, desfeito: true })
        .catch(function () {});
      var partes = [t("rename.undone", { n: r.ok })];
      if (r.diverge.length) partes.push(t("rename.prDiverged", { n: r.diverge.length }));
      if (r.ok) partes.push(t("rename.prSaveHint"));
      dizer(partes.join(" · "), !r.diverge.length && !r.falhas.length);
    }).catch(function (e) { dizer(t("result.failed", { msg: (e && e.message) || String(e) }), false); })
      .then(function () { $("btDesfazer").disabled = false; });
  }

  $("btLerSequenciaPr").addEventListener("click", function () { lerMergedPremiere(""); });
  $("btLerSelecaoPr").addEventListener("click", lerParaRenomearPremiere);

  function aplicarModo(novo) {
    if (novo === modoNle) return;
    modoNle = novo;
    // ⭐ Sem programa conectado não há de onde arrastar: é a única hora em que a dica aparece.
    $("arrastarDica").hidden = !!novo;
    $("arrastarDica").textContent = novo ? "" : t("app.noProgramHint");
    // ⭐ O Subclipar é do Media Composer (subclipe = mob do Avid; no Premiere o equivalente é o merged clip, que o
    // Sincronizar já entrega). Na janela do app a subaba aparece com o MC conectado (demo de 2026-10-23, MC 24.6);
    // no guarda-chuva quem decide as subabas é o modo embutido.
    // O Renomear daqui também é do MC (`SetMobInfo`); o do Premiere vive no painel dele.
    // ⭐ (2026-11-07) No Premiere as duas também existem: "Criar subclipe" faz MERGED clips (câmera + som direto num
    // clipe só — o subclipe do Premiere) e o Renomear escreve pelo host.jsx. As mesmas telas; mudam as pontas
    // (`textosDoNle`, `lerMergedPremiere`, `lerParaRenomearPremiere`…).
    if (!EMBUTIDO) {
      $("tabSubclip").hidden = !novo;
      $("tabRename").hidden = !novo;
      if (!novo && (abaAtual === "subclip" || abaAtual === "rename")) $("tabSources").click();
    }
    textosDoNle();
    desenharFontes();
    estadoPremiere = "";
    pintarConexao();
  }

  function baterConexao() {
    fetch("/conexao", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (c) {
        aplicarModo(c.programa || null);
        if (modoNle === "premiere" && !montando && !AJUSTES) {
          pedirTrabalho();
          premiere("sincEstado", [], 5000)
            .then(function (r) { estadoPremiere = r; pintarConexao(); })
            .catch(function () { /* a próxima batida tenta de novo */ });
        }
      })
      .catch(function () { aplicarModo(null); });
    fetch("/health", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) { versaoDoApp = j.version || ""; pintarConexao(); })
      .catch(function () {});
  }

  // ── Premiere: a seleção da bin vira a origem da caixa onde foi solta ─────────
  // ⭐ No Premiere o arrasto de um CLIPE não diz qual clipe é (banco, premiere-cep/arrastar-e-selecao.md §6): o GESTO vem
  // do arrasto e o DADO vem da seleção. Quem separa câmera de som é a caixa; a extensão só avisa quando vieram os dois.
  function lerSelecaoPremiere(alvo) {
    if (modoNle !== "premiere") { dizer(t("app.premiereOffline"), false); return; }
    if (!alvo) { dizer(t("panel.dropOnBox"), false); return; }
    dizer(t("app.readingSelection"), true);
    premiere("sincGetSelectionPorBin", [], 30000)
      .then(function (raw) {
        var video = [], audio = [], bins = {};
        String(raw || "").split("\n").forEach(function (ln) {
          if (!ln) return;
          var i = ln.indexOf("\t");
          var bin = i >= 0 ? ln.slice(0, i) : "", caminho = i >= 0 ? ln.slice(i + 1) : ln;
          bins[bin] = true;
          (EXTENSAO_DE_AUDIO.test(caminho) ? audio : video).push(caminho);
        });
        if (!video.length && !audio.length) { dizer(t("app.noSelection"), false); return; }
        var nomes = Object.keys(bins);
        entregar(alvo, video, audio, nomes.length === 1 ? nomes[0] : null);
      })
      .catch(function (e) { dizer(t("result.failed", { msg: e.message }), false); });
  }

  // ── Premiere: o mapa do sync vira a sequência ────────────────────────────────
  // ⚠️ PORTADO do painel CEP (`plugins/premiere-cep/js/main.js`: `flattenMap`,
  // `packWithin`, `packByCamera`, `planLayout`), que é o caminho medido no 23.2. Lá
  // ele continua para o painel antigo; aqui é o mesmo plano, com a ponte no lugar do
  // `evalScript` direto. REGRA DO PREMIERE: `overwriteClip` põe vídeo E áudio no MESMO
  // índice de track — a track de vídeo de cada câmera é a 1ª do bloco de áudio dela.
  function planoDoPremiere(map, pathCamera) {
    var video = [], audio = [], vistoSom = {}, revisar = [];
    ((map && map.groups) || []).forEach(function (daily) {
      var fps = daily.fps || 24;
      (daily.camera_groups || []).forEach(function (cg) {
        (cg.cameras || []).forEach(function (cam) {
          video.push({ path: cam.path, start: (cam.timeline_start_frames || 0) / fps,
                       dur: (cam.duration_frames || 0) / fps, ch: cam.audio_channels || 0 });
          // a tomada seguinte da mesma câmera ficou no TC dela, por cima do fim desta
          // (decisão do autor, 2026-10-21): um marcador para o editor revisar o corte
          if (cam.flagged && cam.flag_reason === "overlap_cut") {
            revisar.push({ start: (cam.timeline_start_frames || 0) / fps,
                           nome: String(cam.path).split(/[\\/]/).pop() });
          }
        });
      });
      function som(s) {
        if (!s || !s.path || vistoSom[s.path]) return;
        vistoSom[s.path] = true;
        audio.push({ path: s.path, start: (s.timeline_start_frames || 0) / fps,
                     dur: (s.duration_ms || 0) / 1000, ch: s.channels || 2 });
      }
      (daily.takes || []).forEach(function (tk) { som(tk.sound); });
      (daily.orphan_sounds || []).forEach(som);
    });
    if (!video.length && !audio.length) return null;
    function camDe(p) { return pathCamera[p] || "CÂMERA"; }

    function empilhar(itens) {
      itens.sort(function (a, b) { return a.start - b.start; });
      var fins = [];
      itens.forEach(function (it) {
        for (var k = 0; k < fins.length; k++) {
          if (it.start >= fins[k] - 1e-6) { it.local = k; fins[k] = it.start + it.dur; return; }
        }
        it.local = fins.length; fins.push(it.start + it.dur);
      });
      return Math.max(1, fins.length);
    }

    // o som direto empilhado por fonte, como o `packByCamera` do painel CEP
    var porFonte = {}, ordem = [];
    audio.forEach(function (it) {
      var c = pathCamera[it.path] || "SOM DIRETO";
      if (!porFonte[c]) { porFonte[c] = []; ordem.push(c); }
      porFonte[c].push(it);
    });
    var base = 0;
    ordem.forEach(function (c) {
      var n = empilhar(porFonte[c]);
      porFonte[c].forEach(function (it) { it.track = base + it.local; });
      base += n;
    });
    // ⭐ As trilhas de som direto são os canais do arquivo mais largo OU a pilha (um take mono é um canal por trilha).
    var somCh = Math.max(1, base);
    audio.forEach(function (a) { somCh = Math.max(somCh, a.ch || 2); });
    var cams = [], camCh = {};
    video.forEach(function (v) {
      var c = camDe(v.path);
      if (cams.indexOf(c) < 0) cams.push(c);
      camCh[c] = Math.max(camCh[c] || 1, v.ch || 2);
    });
    var nomesA = [], trackDaCam = {}, nomeDaV = {}, cursor = somCh, ultima = -1;
    for (var s = 0; s < somCh; s++) nomesA.push("SOM DIRETO");
    cams.forEach(function (c) {
      trackDaCam[c] = cursor; nomeDaV[cursor] = c; ultima = cursor;
      var n = camCh[c] || 2;
      for (var k = 0; k < n; k++) nomesA.push(c);
      cursor += n;
    });
    var numV = ultima + 1, nomesV = [];
    for (var tr = 0; tr < numV; tr++) nomesV.push(nomeDaV[tr] || "");

    var regV = video.map(function (it) {
      return "V\t" + it.path + "\t" + it.start.toFixed(4) + "\t" + trackDaCam[camDe(it.path)];
    });
    var regA = audio.map(function (it) {
      return "A\t" + it.path + "\t" + it.start.toFixed(4) + "\t" + it.track;
    });
    return { numV: numV, totalAudio: nomesA.length, nomesV: nomesV, nomesA: nomesA,
             registros: regV.concat(regA).join("\n"), revisar: revisar };
  }

  function camposDoResultado(res) {
    var f = {};
    String(res).replace(/^ok\|/, "").split("|").forEach(function (kv) {
      var p = kv.split("=");
      f[p[0]] = parseInt(p[1], 10) || 0;
    });
    return f;
  }

  // Importa o que falta, monta a sequência e marca o que revisar — o caminho do botão Sincronizar E o do pedido que
  // vem do Ciclo Assist (`executarTrabalho`). Devolve o texto do `sincBuildSequence` (`ok|…` ou `err|…`).
  function montarPeloPlano(plano, pathCamera, nome, formato) {
    progresso({ fraction: 0.9, stage: t("app.importing"), elapsed_ms: 0 });
    var caminhos = [], visto = {};
    plano.registros.split("\n").forEach(function (l) {
      var c = l.split("\t")[1];
      if (c && !visto[c]) { visto[c] = true; caminhos.push(c); }
    });
    var rotulosDosCaminhos = caminhos.map(function (c) { return c + "\t" + (pathCamera[c] || ""); });
    // O material pode nem estar no projeto (veio do Explorer): sem ProjectItem não há
    // o que posicionar, e a montagem falharia inteira. Importa o que falta primeiro.
    return premiere("sincImportMissing", [caminhos.join("\n"), nome, rotulosDosCaminhos.join("\n")], 300000)
      .then(function (res) {
        if (String(res).indexOf("err|") === 0) throw new Error(String(res).slice(4));
        progresso({ fraction: 0.95, stage: t("app.building"), elapsed_ms: 0 });
        return premiere("sincBuildSequence",
          [plano.registros, nome, plano.numV, plano.totalAudio,
           plano.nomesV.join("\t"), plano.nomesA.join("\t"),
           formato ? formato.largura : "", formato ? formato.altura : "", formato ? formato.taxa : ""], 300000);
      })
      .then(function (res) {
        res = String(res || "");
        if (res.indexOf("err|") === 0 || !plano.revisar.length) return res;
        var linhas = plano.revisar.map(function (r) {
          return r.start.toFixed(4) + "\t" + t("app.reviewMarker") + "\t" + t("app.reviewComment", { name: r.nome });
        });
        return premiere("sincMarcadores", [linhas.join("\n")], 60000).then(function () { return res; });
      });
  }

  function montarNoPremiere(result, bt, textoOriginal) {
    var nome = ($("seqNome").value || "").trim() || t("panel.seqNameDefault");
    var rots = rotulos(), pathCamera = {};
    fontes.forEach(function (f, i) { (f.files || []).forEach(function (c) { pathCamera[c] = rots[i]; }); });
    function encerrar() { montando = false; progresso(null); bt.textContent = textoOriginal; bt.disabled = false; }

    var plano = planoDoPremiere(result, pathCamera);
    if (!plano) {
      encerrar();
      // ⚠️ Mapa vazio quase nunca é "não achei nada": é o MOTOR que recusou a diária e
      // explicou por quê. Mostrar a explicação, não um genérico.
      var erros = ((result && result.groups) || []).filter(function (g) { return g && g.error; });
      dizer(erros.length ? erros.map(function (g) { return g.error; }).join(" · ") : t("app.emptyMap"), false);
      return;
    }
    montando = true;
    bt.textContent = t("app.building");
    var formato = formatoDaTimeline();
    montarPeloPlano(plano, pathCamera, nome, formato)
      .then(function (res) {
        encerrar();
        res = String(res || "");
        if (res.indexOf("err|") === 0) throw new Error(res.slice(4));
        var f = camposDoResultado(res), avisos = [];
        if (formato && f.placed && (f.escala || 0) < f.placed) avisos.push(t("app.buildNoScale", { n: f.placed - (f.escala || 0) }));
        if (plano.revisar.length) avisos.push(t("app.reviewCount", { n: plano.revisar.length }));
        if (f.missing) avisos.push(t("app.buildMissing", { n: f.missing }));
        if (f.failed) avisos.push(t("app.buildFailed", { n: f.failed }));
        dizer([t("app.built", { name: nome, placed: f.placed || 0, audio: f.audio || 0 })]
              .concat(avisos).join(" "), !avisos.length);
      })
      .catch(function (e) { encerrar(); dizer(t("result.failed", { msg: e.message }), false); });
  }

  // ── O PEDIDO DO CICLO ASSIST (a fila `/nlejob`) ──────────────────────────────
  // ⭐ Dentro do guarda-chuva é ESTA página que monta no Premiere, pela ponte invisível — o painel CEP do Órbita não
  // existe mais nesta máquina (a ponte o substitui ao ser instalada). O chat do Assist pede pela `/api/v1` (`nlejob`:
  // montar o sync; `merge`: importar os merged em CENAS/<cena>); o trabalho fica na fila e quem vem buscar é a batida
  // daqui. Perguntar com `?nle=premiere` também MARCA PRESENÇA: é o que faz a `/api/v1` aceitar (sem ninguém
  // buscando, ela recusa com 412 em vez de deixar o trabalho numa fila sem dono).
  // ⛔ Só com a ponte viva e nada sendo montado: quem tira da fila tem de conseguir executar.
  // ⛔ Um pedido à fila por vez: quem TIRA o trabalho executa; dois em voo tirariam dois e montariam juntos.
  var pedindo = false;
  function pedirTrabalho() {
    if (AJUSTES || modoNle !== "premiere" || montando || pedindo) return;
    pedindo = true;
    fetch("/nlejob?nle=premiere", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { pedindo = false; if (j && j.job) executarTrabalho(j.job); })
      .catch(function () { pedindo = false; /* a próxima batida pergunta de novo */ });
  }

  function devolverTrabalho(id, nome, ok, resumo) {
    fetch("/nlejob/done", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id, name: nome, ok: !!ok, summary: resumo })
    }).catch(function () { /* o resultado já foi dito na tela */ });
  }

  function executarTrabalho(job) {
    montando = true;
    var merged = job.tipo === "merged";
    var nome = (job.name || "").trim() || (merged ? "MERGED" : t("panel.seqNameDefault"));
    function fim(ok, resumo, texto) {
      montando = false; progresso(null); dizer(texto, ok); devolverTrabalho(job.id, nome, ok, resumo);
    }
    function falhou(e) {
      var msg = (e && e.message) || String(e);
      fim(false, "err|" + msg, t("app.jobFailed", { msg: msg }));
    }
    if (merged) {
      dizer(t("app.mergedImporting", { name: nome }), true);
      progresso({ fraction: 0.5, stage: t("app.mergedImporting", { name: nome }), elapsed_ms: 0 });
      premiere("sincImportMerged", [job.arquivo || "", ""], 300000)
        .then(function (txt) {
          var r = {};
          String(txt || "").split("\n").forEach(function (l) {
            var c = l.split("\t"); r[c[0]] = c.slice(1).join("\t");
          });
          if (r.erro) { fim(false, "erro|" + r.erro, t("app.jobFailed", { msg: r.erro })); return; }
          var n = Number(r.merged || 0);
          fim(true, "ok|merged=" + n + "|novos=" + (r.novos || 0) + "|bins=" + (r.bins || ""),
              n ? t("app.mergedDone", { n: n, bins: r.bins || "—" }) : t("app.mergedNothing"));
        })
        .catch(falhou);
      return;
    }
    var pathCamera = job.labels || {};
    var plano = planoDoPremiere(job.map, pathCamera);
    if (!plano) { fim(false, "err|" + t("app.emptyMap"), t("app.emptyMap")); return; }
    dizer(t("app.jobReceived", { name: nome }), true);
    montarPeloPlano(plano, pathCamera, nome)
      .then(function (res) {
        res = String(res || "");
        if (res.indexOf("err|") === 0) { fim(false, res, t("app.jobFailed", { msg: res.slice(4) })); return; }
        var f = camposDoResultado(res);
        fim(true, res, t("app.built", { name: nome, placed: f.placed || 0, audio: f.audio || 0 }));
      })
      .catch(falhou);
  }

  // ── O ARRASTO pelo alvo NATIVO (`src-tauri/src/arrasto_win.rs`) ──────────────
  // Na janela do app o drop da webview fica desligado (para o Avid, ele fazia o MC
  // EXPORTAR um AAF com modal). Quem recebe é o alvo nativo, que avisa por aqui:
  // `{fase: "sobre"|"saiu"|"soltou", tipo, dados?, caminhos?}`.
  // o MESMO `aoSoltar` do drop dentro do MC: um `dataTransfer` de mentira com o payload que o alvo nativo leu
  function soltarDoAvid(dados) {
    aoSoltar({ types: [MIME_ASSETS_MC],
               getData: function (k) { return k === MIME_ASSETS_MC ? dados : ""; } });
  }

  window.sincArrasto = function (ev) {
    if (!ev) return;
    if (ev.fase === "sobre") {
      if (abaAtual === "sources" && ev.tipo !== "nada") { marcarAlvo(ev.x, ev.y); return; }
      realcar(ev.tipo !== "nada");
      return;
    }
    realcar(false);
    apagarAlvo();
    if (ev.fase !== "soltou") return;
    // ⚠️ Só os Ajustes não recebem arrasto: o Subclipar e o Renomear têm o seu, e voltar sempre ao Sincronizar
    // mandava a timeline solta no Subclipar para a aba errada (pilotado no MC 24.6, 2026-10-21).
    if (abaAtual === "settings") aba("sources");
    alvoDoSoltar = abaAtual === "sources" ? alvoEm(ev.x, ev.y) : null;
    switch (ev.tipo) {
      case "avid":
        // ⭐ No MAC (`arrasto_mac.rs` do Ciclo Assist, 2026-11-07) o MC só entrega os MobIDs, sem a espécie: o
        // servidor a pergunta à API (`/arrasto/mc`) e devolve os itens na forma do Windows.
        if (!ev.dados && ev.mob_ids && ev.mob_ids.length) {
          dizer(t("panel.dropReading", { n: ev.mob_ids.length }), true);
          fetch("/arrasto/mc", { method: "POST", headers: { "Content-Type": "application/json" },
                                 body: JSON.stringify({ mob_ids: ev.mob_ids }) })
            .then(function (r) { return r.json(); })
            .then(function (res) {
              if (!res || !res.ok) { dizer((res && res.erro) || t("panel.dropUnreadable"), false); return; }
              soltarDoAvid(JSON.stringify(res.itens || []));
            })
            .catch(function (e) { dizer(t("result.failed", { msg: (e && e.message) || String(e) }), false); });
          return;
        }
        soltarDoAvid(ev.dados || "");
        return;
      case "premiere":
      case "premiere_item":
        // ⭐ (2026-11-07) No Subclipar, a SEQUÊNCIA arrastada vira merged clips; no Renomear, a seleção da bin
        // vira a lista. O Premiere seleciona o que começa a ser arrastado: o dado vem da seleção.
        if (abaAtual === "subclip") {
          premiere("sincSelectedSequenceNode", [], 15000).then(function (r) {
            r = String(r || "");
            if (r === "err|notsequence") dizer(t("subclip.prOnlySequence"), false);
            else if (r === "err|manysequences") dizer(t("subclip.prManySequences"), false);
            else if (r.indexOf("err|") === 0) dizer(t("result.failed", { msg: r.slice(4) }), false);
            else lerMergedPremiere(r);
          }).catch(function (e) { dizer(t("result.failed", { msg: (e && e.message) || String(e) }), false); });
          return;
        }
        if (abaAtual === "rename") { lerParaRenomearPremiere(); return; }
        lerSelecaoPremiere(alvoDoSoltar);
        return;
      case "bin":
        dizer(t("app.dropBin"), false);
        return;
      default:
        dizer(t("panel.dropUnknown"), false);
    }
  };

  function ligarCascaApp() {
    document.body.classList.add("casca-app");
    // Sincronizar e ⚙ (decisão 1 do organograma de 2026-10-21); Subclipar e Renomear aparecem com o MC (`aplicarModo`)
    $("tabSubclip").hidden = true;
    $("tabRename").hidden = true;
    // o Sincronizar do rodapé é da subaba de fontes: no Subclipar e no Renomear ele seria um botão de outra tela
    ["tabSources", "tabSubclip", "tabRename", "tabSettings"].forEach(function (id) {
      $(id).addEventListener("click", function () {
        $("rodapeSync").style.display = id === "tabSources" ? "" : "none";
      });
    });
    $("rodape").hidden = false;
    $("rodape").insertBefore($("prog"), $("rodapeSync"));
    // o Sincronizar e a assinatura SOBEM para a barra fixa: o botão do passo sempre à vista,
    // sem rolar a lista de fontes (cinco câmeras empurravam-no para fora da tela)
    $("rodapeSync").appendChild($("btSync"));
    $("rodapeAssinatura").appendChild($("assinaturaBy"));
    $("rodapeAssinatura").appendChild(document.createTextNode(" "));
    $("rodapeAssinatura").appendChild($("autor"));
    $("assinatura").style.display = "none";
    // a página ganha embaixo a altura da barra, para ela nunca cobrir nada
    function ajustarBarra() { document.body.style.paddingBottom = ($("rodape").offsetHeight + 16) + "px"; }
    ajustarBarra();
    if (typeof ResizeObserver === "function") { new ResizeObserver(ajustarBarra).observe($("rodape")); }
    // ⭐ Fase 4: o bloco "instalar a ponte do Premiere" fica escondido — a ponte é a única, do Ciclo Assist
    $("hInstalar").textContent = t("app.installTitle");
    $("hintInstalar").textContent = t("app.installPremiereHint");
    $("btInstalar").textContent = t("app.installPremiere");
    $("btInstalar").addEventListener("click", function () {
      acaoSimples("/app/instalar-premiere", {}, $("btInstalar"), t("app.installed"));
    });
    // O pino: quem mexe na janela é o executável (`/app/fixar`); lembrado entre aberturas.
    // No guarda-chuva a janela é dele — lá o `#status` inteiro some (CSS `.embutido`).
    var CHAVE_PINO = "sincronizar.painel.pino";
    function aplicarPino(fixar) {
      var b = $("pino");
      b.setAttribute("aria-pressed", fixar ? "true" : "false");
      b.title = fixar ? t("app.pinOn") : t("app.pinOff");
      try { localStorage.setItem(CHAVE_PINO, fixar ? "1" : ""); } catch (e) { /* só conveniência */ }
      fetch("/app/fixar", { method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ fixar: fixar }) }).catch(function () {});
    }
    if (!EMBUTIDO) {
      $("pino").hidden = false;
      $("pino").addEventListener("click", function () {
        aplicarPino($("pino").getAttribute("aria-pressed") !== "true");
      });
      var lembrado = false;
      try { lembrado = localStorage.getItem(CHAVE_PINO) === "1"; } catch (e) { /* idem */ }
      aplicarPino(lembrado);
    }
    modoNle = undefined;
    aplicarModo(null);
    baterConexao();
    setInterval(baterConexao, BATIDA_MS);
    // ⭐ Escondida no guarda-chuva, o WebKit do Mac para os temporizadores desta página: quem bate é o app
    // (`bater_nas_escondidas` do Ciclo Assist, a cada pulso do supervisor).
    window.sincBater = baterConexao;
  }
  if (CASCA_APP) ligarCascaApp();

  // ⭐ Embutido no guarda-chuva do Ciclo Assist (ver o CSS `.embutido`): o mesmo contrato nos três apps.
  if (EMBUTIDO) {
    document.documentElement.classList.add("embutido");
    // as subabas do Preparar: Sincronizar · Subclipar · Renomear — o modo app as escondia. ⭐ Era "Órbita" (2026-10-21);
    // com o Órbita aposentado vira o nome da FUNÇÃO (plano um app só, 2026-11-07), o do dicionário.
    $("tabSources").textContent = t("panel.tabSources");
    $("tabSubclip").hidden = false;
    $("tabRename").hidden = false;
  }
  // `configuracoes()` alterna; `configuracoes(false)` FECHA e volta à subaba de onde o editor veio — o guarda-chuva
  // chama assim quando esta aba sai de vista (senão ela voltava nos ajustes, visto pelo autor em 2026-10-21).
  var abaAntesDosAjustes = "tabSources";
  window.cicloEmbutido = {
    configuracoes: function (abrir) {
      var aberta = $("tabSettings").classList.contains("on");
      var querer = abrir === undefined ? !aberta : !!abrir;
      if (querer === aberta) return;
      if (querer) {
        ["tabSources", "tabSubclip", "tabRename"].forEach(function (id) {
          if ($(id).classList.contains("on")) abaAntesDosAjustes = id;
        });
        $("tabSettings").click();
      } else {
        $(abaAntesDosAjustes).click();
      }
    }
  };

  if (AJUSTES) {
    document.documentElement.classList.add("so-ajustes");
    aba("settings");
  }

  bater();
  setInterval(bater, BATIDA_MS);
})();
</script>
</body>
</html>
